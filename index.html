/* ===================================================================== */
/*                            event delegation                           */
/* ===================================================================== */
document.addEventListener('click', async e => {
  /* scoped to #pad: the map's pins carry a data-key of their own */
  const keyBtn = e.target.closest('#pad [data-key]');
  if (keyBtn){ pressKey(keyBtn.dataset.key); return; }

  const goEl = e.target.closest('[data-go]');
  if (goEl){ go(goEl.dataset.go); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  const id = el.dataset.id, pid = el.dataset.pid;

  switch (a){
    /* --- capture --- */
    case 'newPerson': go('#/edit/new'); break;
    case 'pickPhoto': {
      const files = await pickFile('image/*', true);
      for (const f of files){
        const rec = await ingestPhoto(f, '__draft__');
        state.draft.photos.push(rec);
      }
      if (files.length) render();
      break;
    }
    case 'dropDraftPhoto': {
      forgetURL(id);
      await DB.del('photos', id);
      state.draft.photos = state.draft.photos.filter(p => p.id !== id);
      render();
      break;
    }
    case 'clearDraft': {
      if (!await confirmSheet(t('cap.clear'), t('c.confirm'))) break;
      await clearDraft();
      render();
      break;
    }

    /* --- review --- */
    case 'rvToggle': {
      const e0 = state.review.entries[+el.dataset.e];
      e0.on = !e0.on;
      await DB.put('meta', state.review, 'review');
      render();
      break;
    }
    case 'rvChange': {
      const c = state.review.entries[+el.dataset.e].changes[+el.dataset.c];
      c.on = !c.on;
      await DB.put('meta', state.review, 'review');
      render();
      break;
    }
    case 'rvFact': {
      const f = state.review.entries[+el.dataset.e].facts[+el.dataset.f];
      f.on = !f.on;
      await DB.put('meta', state.review, 'review');
      render();
      break;
    }
    case 'applyReview': {
      const n = await applyReview();
      toast(t('rev.applied', { n }));
      go('#/people');
      break;
    }
    case 'discardReview': {
      if (!await confirmSheet(t('rev.discard'), t('rev.discardQ'))) break;
      state.review = null;
      await DB.del('meta', 'review');
      go('#/capture');
      break;
    }

    /* --- people --- */
    case 'filter': {
      state.filter = el.dataset.cat;
      $$('#chips .chip').forEach(c => c.classList.toggle('on', c.dataset.cat === state.filter));
      paintPeopleList();
      break;
    }

    /* --- crown --- */
    case 'star': {
      const p = state.people.find(x => x.id === id);
      p.starred = !p.starred;
      await savePerson(p);
      if (navigator.vibrate) navigator.vibrate(p.starred ? 18 : 8);
      render();
      break;
    }

    /* --- map --- */
    case 'mapGroup': {
      state.mapGroup = el.dataset.cat;
      $$('#mapChips .chip').forEach(c => c.classList.toggle('on', c.dataset.cat === state.mapGroup));
      state.mapFitPending = '';
      paintMap({ personId: state.mapScope?.personId || '', group: state.mapGroup });
      break;
    }
    case 'mapZoom': {
      if (!state.map) break;
      const { w, h } = state.map.size();
      state.map.zoomAround(w / 2, h / 2, +el.dataset.d);
      state.mapView = { center: state.map.center, zoom: state.map.zoom };
      break;
    }
    case 'mapFit': {
      if (state.map) state.map.fit();
      break;
    }
    case 'mapFilter': mapFilterSheet(); break;
    case 'mapKind': {
      const k = el.dataset.kind;
      const set = new Set(state.settings.mapKinds || PLACE_KINDS);
      set.has(k) ? set.delete(k) : set.add(k);
      state.settings.mapKinds = PLACE_KINDS.filter(x => set.has(x));
      await saveSettings();
      mapFilterSheet();
      if (state.mapScope) paintMap(state.mapScope);
      break;
    }
    case 'mapCluster': {
      if (!state.map) break;
      const [a, b, c, d] = el.dataset.bbox.split(',').map(Number);
      state.map.fit(a === c && b === d ? [{ lat: a, lon: b }]
                                      : [{ lat: a, lon: b }, { lat: c, lon: d }], 90);
      break;
    }
    case 'mapPin': {
      const [pid, pkey] = el.dataset.pinid.split('|');
      placeSheet(pid, pkey);
      break;
    }
    case 'pinByHand': {
      const [pid, pkey] = el.dataset.pinid.split('|');
      startPicking(pid, pkey);
      break;
    }
    case 'missingList': missingSheet(); break;
    case 'placeMenu': placeSheet(id, el.dataset.key); break;
    case 'movePin': { closeSheet(); startPicking(id, el.dataset.key); break; }
    case 'clearPin': {
      const p = state.people.find(x => x.id === id);
      delete (p.pins || {})[el.dataset.key];
      await savePerson(p);
      closeSheet();
      if (state.mapScope) paintMap(state.mapScope); else render();
      break;
    }
    case 'cancelPick': {
      state.picking = null;
      if (state.map) state.map.onPick = null;
      $('#mapBanner')?.classList.remove('on', 'pick');
      if (state.mapScope) paintMap(state.mapScope);
      break;
    }
    case 'addPlace': addPlaceSheet(id); break;
    case 'delPlace': {
      const p = state.people.find(x => x.id === id);
      p.places = (p.places || []).filter(x => 'extra:' + x.id !== el.dataset.key);
      delete (p.pins || {})[el.dataset.key];
      await savePerson(p);
      closeSheet();
      render();
      break;
    }

    /* --- person --- */
    case 'addFact': addFact(id); break;
    case 'delFact': {
      const p = state.people.find(x => x.id === id);
      p.facts = (p.facts || []).filter(f => f.id !== el.dataset.fid);
      await savePerson(p);
      render();
      break;
    }
    case 'pickPersonPhoto': {
      const files = await pickFile('image/*', true);
      const p = state.people.find(x => x.id === id);
      for (const f of files){
        const rec = await ingestPhoto(f, id);
        if (!p.avatarId){ p.avatarId = rec.id; await savePerson(p); }
      }
      if (files.length){ invalidatePhotos(id); render(); }
      break;
    }
    case 'photoMenu': photoSheet(id, pid); break;
    case 'viewPhoto': {
      const rec = await DB.get('photos', pid);
      if (rec){ $('#viewerImg').src = photoURL(rec); $('#viewer').classList.add('on'); }
      closeSheet();
      break;
    }
    case 'makeAvatar': {
      const p = state.people.find(x => x.id === id);
      p.avatarId = pid;
      await savePerson(p);
      closeSheet(); render();
      break;
    }
    case 'delPhoto': {
      closeSheet();
      if (!await confirmSheet(t('per.delPhoto'), t('c.confirm'))) break;
      const p = state.people.find(x => x.id === id);
      forgetURL(pid);
      await DB.del('photos', pid);
      if (p.avatarId === pid){
        const rest = (await DB.byPerson(id)).filter(x => x.id !== pid);
        p.avatarId = rest[0]?.id || '';
        await savePerson(p);
      }
      invalidatePhotos(id);
      render();
      break;
    }
    case 'delPerson': {
      const p = state.people.find(x => x.id === id);
      if (!await confirmSheet(t('per.delete'), t('per.deleteQ', { name: p.name }))) break;
      for (const ph of await DB.byPerson(id)){ forgetURL(ph.id); await DB.del('photos', ph.id); }
      await DB.del('people', id);
      state.people = state.people.filter(x => x.id !== id);
      invalidatePhotos(id);
      go('#/people');
      break;
    }

    /* --- edit --- */
    case 'cancelEdit': {
      const back = state.editing && state.people.some(x => x.id === state.editing.id)
        ? '#/person/' + state.editing.id : '#/people';
      state.editing = null;
      go(back);
      break;
    }
    case 'saveEdit': {
      const p = collectEdit();
      if (!p.name.trim()){ toast(t('per.nameReq')); break; }
      const isNew = el.dataset.new === '1';
      await savePerson(p);
      state.editing = null;
      toast(isNew ? t('per.added', { name: p.name }) : t('per.saved'));
      location.hash = '#/person/' + p.id;
      break;
    }

    /* --- settings --- */
    case 'setLang': {
      state.settings.lang = el.dataset.lang;
      state.lang = state.settings.lang;
      await saveSettings();
      applyLang();
      sortPeople();
      render();
      break;
    }
    case 'testKey': testKey(); break;
    case 'addCat': {
      const inp = $('#newCat');
      const v = (inp.value || '').trim();
      if (!v) break;
      const key = v.toLowerCase();
      if (allCats().some(c => c.toLowerCase() === key || catLabel(c).toLowerCase() === key)){ inp.value = ''; break; }
      state.settings.categories = uniq([...(state.settings.categories || []), v]);
      await saveSettings();
      inp.value = '';
      render();
      break;
    }
    case 'delCat': {
      const c = el.dataset.cat;
      const used = state.people.filter(p => p.category === c).length;
      if (used){ toast(t('set.catUsed', { n: used })); break; }
      state.settings.categories = (state.settings.categories || []).filter(x => x !== c);
      await saveSettings();
      render();
      break;
    }
    case 'setPass': {
      const a1 = ($('#p1').value || '').trim(), a2 = ($('#p2').value || '').trim();
      if (!/^\d{4}$/.test(a1)){ toast(t('set.passShort')); break; }
      if (a1 !== a2){ toast(t('set.passMismatch')); break; }
      state.settings.pass = await sha(a1);
      await saveSettings();
      $('#p1').value = ''; $('#p2').value = '';
      toast(t('set.passSaved'));
      break;
    }
    case 'exportData': exportData(); break;
    case 'importData': importData(); break;
    case 'wipe': wipeAll(); break;
    case 'closeSheet': closeSheet(); break;
  }
});

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'rvCat'){
    state.review.entries[+el.dataset.e].category = el.value;
    await DB.put('meta', state.review, 'review');
  }
  if (el.dataset.act === 'rvPhotoMove'){
    const pid = el.dataset.pid, to = el.value;
    for (const entry of state.review.entries) entry.photos = entry.photos.filter(x => x !== pid);
    if (to !== '-') state.review.entries[+to].photos.push(pid);
    await DB.put('meta', state.review, 'review');
    render();
  }
});
document.addEventListener('input', async e => {
  const el = e.target.closest('[data-act="rvName"]');
  if (!el) return;
  state.review.entries[+el.dataset.e].name = el.value;
  clearTimeout(el._t);
  el._t = setTimeout(() => DB.put('meta', state.review, 'review'), 400);
});

$('#viewer').addEventListener('click', () => {
  $('#viewer').classList.remove('on');
  $('#viewerImg').src = '';
});

window.addEventListener('hashchange', render);

/* ------------------------------- boot -------------------------------- */
/* iOS can hand a Home-Screen app a window shorter than the glass while 100vh
   still reports the full height. Taking the largest of every measure available
   claims that strip; when they all agree, nothing changes. */
function fitShell(){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:0;height:100vh;pointer-events:none';
  document.body.appendChild(probe);
  const vh = probe.offsetHeight;
  probe.remove();
  const h = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, vh || 0);
  if (h) document.documentElement.style.setProperty('--appH', h + 'px');
}
fitShell();
addEventListener('resize', fitShell);
addEventListener('orientationchange', () => setTimeout(fitShell, 150));
addEventListener('pageshow', fitShell);

function applyLang(){
  const rtl = state.lang === 'he';
  document.documentElement.lang = state.lang;
  document.documentElement.dir = rtl ? 'rtl' : 'ltr';
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
}

(async function boot(){
  buildPad();
  await loadSettings();
  applyLang();
  await loadPeople();
  await preloadPhotos();
  await loadDraft();
  state.review = (await DB.get('meta', 'review')) || null;
  if (!location.hash) location.hash = '#/capture';
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
