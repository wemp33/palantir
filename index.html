<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Palantir</title>
<meta name="description" content="Everything you know about the people you know.">
<!-- Matches --bar exactly. iOS paints the strip outside a Home-Screen app's
     web view with this colour; when it differed from the tab bar it read as a
     band below the app. Keep these three in step with --bar. -->
<meta name="theme-color" content="#152134">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- `black-translucent` + viewport-fit=cover is the one combination that gives a
     Home-Screen app the entire screen. With `black`, iOS reserves its own chrome
     and hands the page a shorter canvas — the dead strip under the tab bar that
     no CSS can reach, because it is outside the web view. The status bar and the
     home indicator are handled inside the page via the safe-area insets, which
     the top bar and tab bar already pad for. Install-time setting: changing it
     requires removing the icon and adding the app to the Home Screen again. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palantir">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-64.png" sizes="64x64" type="image/png">
<style>
/* ============================ palette & base ============================ */
:root{
  --ink:#060B13;
  --navy:#0A1523;
  --lift:#101E33;
  --hair:rgba(255,255,255,.075);
  --hair-2:rgba(255,255,255,.14);
  --glass:linear-gradient(180deg,rgba(255,255,255,.058),rgba(255,255,255,.022));
  --glass-hi:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  --fg:#F3F7FC;
  --dim:#A6B5CA;
  --faint:#75879F;   /* 5:1 on the page ground — micro-labels stay legible */
  --white:#fff;
  --bar:#152134;          /* opaque chrome — clearly lighter than the page */
  --danger:#FF9E96;
  --r:18px;
  --r-sm:13px;
  --tap:46px;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',Georgia,serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --pad-x:18px;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.24);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink);height:100%}
body{
  margin:0;height:100%;overflow:hidden;
  color:var(--fg);background:var(--bar);
  font:400 16px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none}
input,textarea,select{-webkit-appearance:none;appearance:none}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.005em}
::selection{background:rgba(255,255,255,.24)}
.u-sel{-webkit-user-select:text;user-select:text}
.chrome{-webkit-user-select:none;user-select:none}
.mark{display:block}

/* ============================ lock screen ============================ */
#lock{
  position:fixed;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--safe-t) + 34px) 22px calc(var(--safe-b) + 22px);
  background:
    radial-gradient(120% 46% at 50% 6%, #1D3557 0%, rgba(16,30,51,0) 64%),
    linear-gradient(180deg,#0B1728 0%,#060C16 100%);
}
#lock.hide{display:none}
.lock-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0}
.lock-glow{position:relative;display:grid;place-items:center}
.lock-glow::before{
  content:'';position:absolute;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(180,210,255,.18) 0%,rgba(180,210,255,0) 68%);
}
.lock-name{font-family:var(--serif);font-size:25px;letter-spacing:.19em;text-transform:uppercase;text-indent:.19em}
.lock-sub{color:var(--faint);font-size:13.5px;margin-top:-8px}
.dots{display:flex;gap:16px;margin-top:8px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.26);transition:all .16s cubic-bezier(.2,.8,.3,1)}
.dot.on{background:var(--white);border-color:var(--white);box-shadow:0 0 12px rgba(255,255,255,.45)}
#lock.err .dots{animation:shake .42s}
@keyframes shake{10%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-4px)}}
.lock-msg{min-height:18px;font-size:13px;color:var(--danger);margin-top:12px}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px 26px;justify-content:center;flex:none}
.key{
  height:74px;border-radius:50%;border:1px solid var(--hair);
  background:var(--glass);
  font-size:27px;font-weight:300;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,transform .09s;
}
.key:active{background:rgba(255,255,255,.17);transform:scale(.94)}
.key.blank{border:0;background:none;pointer-events:none}
.key.fn{font-size:19px;border-color:transparent;background:none;color:var(--dim)}

/* ============================ app shell ============================ */
/* A flex column pinned to the viewport: main scrolls, the tab bar cannot
   drift off the bottom the way a fixed bar does on iOS. The height comes from
   a measured --vh rather than 100% / 100dvh, because Safari resolves those
   against a layout viewport that does not always match what you can see. */
#app{
  position:fixed;top:0;left:0;right:0;
  height:var(--appH, 100vh);            /* the tallest measure the page is given */
  display:none;flex-direction:column;overflow:hidden;
  /* a soft light off the stone at the top, settling into black at the foot */
  background:
    radial-gradient(130% 46% at 50% -6%, #1B3050 0%, rgba(16,30,51,0) 62%),
    linear-gradient(180deg, #0B1728 0%, #070E1A 55%, #050A12 100%);
}
#app.on{display:flex}
#topbar{
  flex:none;z-index:20;
  padding:calc(var(--safe-t) + 9px) calc(var(--safe-r) + var(--pad-x)) 9px calc(var(--safe-l) + var(--pad-x));
  display:flex;align-items:center;gap:10px;min-height:50px;
  border-bottom:1px solid var(--hair);
  background:var(--bar);
}
.tb-title{font-family:var(--serif);font-size:19.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-btn{
  min-width:38px;height:34px;padding:0 13px;border-radius:11px;border:1px solid var(--hair);
  color:var(--fg);font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--glass);white-space:nowrap;transition:background .12s;
}
.tb-btn:active{background:rgba(255,255,255,.16)}
.tb-btn.plain{border-color:transparent;background:none;padding:0 5px;min-width:32px;color:var(--dim)}
.tb-btn.strong{background:var(--white);color:#0A1523;border-color:var(--white);font-weight:600}
.tb-btn[disabled]{opacity:.4}
main{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:20px calc(var(--safe-r) + var(--pad-x)) 34px calc(var(--safe-l) + var(--pad-x));
}
/* the app is shaped for a phone; on anything wider it keeps that column
   rather than stretching a text box across a desktop monitor */
@media (min-width: 620px){
  main > *{max-width:560px;margin-inline:auto}
  main.map-view > *{max-width:none}
  #topbar > .tb-title{max-width:none}
  #tabs{max-width:560px;margin-inline:auto;width:100%}
}
#tabs{
  flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
  padding:6px calc(var(--safe-r) + 6px) max(var(--safe-b), 6px) calc(var(--safe-l) + 6px);
  border-top:1px solid var(--hair-2);
  background:var(--bar);
}
/* The page ground lives on #app, and <body> behind it is painted the tab bar's
   own colour. So if this device ever hands the page a viewport shorter than the
   screen, what shows below the bar is the bar's colour — the bar reads as
   taller rather than as a stray band. Belt and braces behind inset:0. */
#tabs.hide{display:none}
.tab{
  height:42px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--faint);font-size:10px;font-weight:500;letter-spacing:0;transition:color .16s;
  min-width:0;overflow:hidden;white-space:nowrap;
}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--white)}
.tab.on svg{filter:drop-shadow(0 0 9px rgba(180,210,255,.45))}
.tab:active{background:rgba(255,255,255,.07)}

/* ============================ building blocks ============================ */
.card{
  background:var(--glass);border:1px solid var(--hair);border-radius:var(--r);padding:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055);
}
.card.flush{padding:0;overflow:hidden}
.card + .card{margin-top:12px}
.sec{margin:28px 0 11px;font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.sec:first-child{margin-top:2px}
.btn{
  min-height:var(--tap);padding:0 18px;border-radius:14px;border:1px solid var(--hair-2);
  display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:15.5px;font-weight:500;
  background:var(--glass);width:100%;transition:background .12s,transform .09s;
}
.btn:active{background:rgba(255,255,255,.15);transform:scale(.988)}
.btn.primary{
  background:linear-gradient(180deg,#fff,#E4EBF4);color:#0A1523;border-color:transparent;font-weight:650;
  box-shadow:0 6px 20px rgba(160,200,255,.16);
}
.btn.primary:active{background:linear-gradient(180deg,#E9EFF7,#CFDAE8)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger);border-color:rgba(255,158,150,.32);background:none}
.btn[disabled]{opacity:.42;pointer-events:none;box-shadow:none}
.btn.small{min-height:38px;font-size:14px;padding:0 14px;width:auto;border-radius:11px}
.row{display:flex;gap:10px}
.row > *{flex:1}
input[type=text],input[type=password],input[type=search],textarea,select{
  width:100%;background:rgba(255,255,255,.045);border:1px solid var(--hair);
  border-radius:var(--r-sm);padding:12px 14px;font-size:16px;color:var(--fg);
  min-height:var(--tap);line-height:1.45;transition:border-color .14s,background .14s;
}
textarea{resize:vertical;min-height:96px}
input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.075)}
input::placeholder,textarea::placeholder{color:var(--faint)}
select{
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-inline-end:36px;
}
[dir=rtl] select{background-position:19px 52%,14px 52%}
.lbl{display:block;font-size:12px;color:var(--dim);margin:0 0 7px 2px}
.field + .field{margin-top:14px}
.hint{font-size:12.5px;color:var(--faint);line-height:1.55;margin-top:8px}
.empty{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;color:var(--faint);padding:56px 20px;font-size:14.5px;line-height:1.65}
.empty .mark{opacity:.16}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:31px;padding:0 13px;border-radius:999px;
  border:1px solid var(--hair);background:var(--glass);font-size:12.5px;color:var(--dim);white-space:nowrap;
  transition:all .14s;
}
.chip.on{background:var(--white);color:#0A1523;border-color:var(--white);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.avatar{
  width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover;
  background:linear-gradient(160deg,#1B3151,#122238);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;color:#B8C8DE;
  border:1px solid var(--hair-2);overflow:hidden;
}
img.avatar{display:block}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 82px);
  z-index:70;background:#17273F;border:1px solid var(--hair-2);border-radius:13px;
  padding:12px 18px;font-size:14px;max-width:min(92vw,420px);text-align:center;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-5px)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============================ capture ============================ */
.hero{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.hero .glow{position:relative;display:grid;place-items:center;flex:none}
.hero .glow::before{
  content:'';position:absolute;width:78px;height:78px;border-radius:50%;
  background:radial-gradient(circle,rgba(180,210,255,.22) 0%,rgba(180,210,255,0) 70%);
}
.hero h1{font-size:25px;line-height:1.12}
.hero p{margin:3px 0 0;font-size:13.5px;color:var(--faint)}
.capture-box textarea{
  min-height:158px;font-size:17px;line-height:1.55;border-radius:var(--r);padding:15px 16px;
  background:rgba(255,255,255,.038);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.capture-tools{display:flex;align-items:center;gap:11px;margin-top:13px}
.mic{
  width:54px;height:54px;border-radius:50%;flex:none;border:1px solid var(--hair-2);
  background:var(--glass-hi);display:flex;align-items:center;justify-content:center;
  transition:all .16s;
}
.mic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mic:active{transform:scale(.94)}
.mic.rec{background:var(--white);color:#0A1523;border-color:var(--white);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.28)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.icon-btn{
  width:46px;height:46px;border-radius:14px;border:1px solid var(--hair);background:var(--glass);
  display:flex;align-items:center;justify-content:center;flex:none;transition:background .12s;
}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:rgba(255,255,255,.16)}
.icon-btn.muted{color:var(--faint)}
.mic-label{font-size:13.5px;color:var(--faint);flex:1;min-width:0}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:13px 0 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:none}
.thumb img{width:80px;height:80px;object-fit:cover;border-radius:14px;border:1px solid var(--hair);display:block}
.thumb button{
  position:absolute;top:-7px;inset-inline-end:-7px;width:25px;height:25px;border-radius:50%;
  background:#16263D;border:1px solid var(--hair-2);color:var(--fg);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
}
.mini{
  display:flex;align-items:center;gap:12px;padding:11px 15px;width:100%;text-align:start;position:relative;
}
.mini + .mini::before{content:'';position:absolute;top:0;inset-inline-start:65px;inset-inline-end:0;height:1px;background:var(--hair)}
.mini:active{background:rgba(255,255,255,.05)}
.mini .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15.5px}
.mini .when{font-size:12.5px;color:var(--dim);text-align:end;white-space:nowrap;line-height:1.35}

/* ============================ people ============================ */
.plist{border:1px solid var(--hair);border-radius:var(--r);background:var(--glass);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.055)}
.prow{
  display:flex;align-items:center;gap:13px;padding:12px 15px;width:100%;text-align:start;position:relative;
}
.prow + .prow::before{content:'';position:absolute;top:0;inset-inline-start:74px;inset-inline-end:0;height:1px;background:var(--hair)}
.prow:active{background:rgba(255,255,255,.055)}
.prow .nm{font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sub{font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.prow .col{min-width:0;flex:1}
.prow .chev{flex:none;opacity:.35}

/* ============================ person ============================ */
.phero{display:flex;gap:16px;align-items:center;margin-bottom:4px}
.phero .avatar{width:84px;height:84px;font-size:30px}
.phero h1{font-size:25px;line-height:1.16;word-break:break-word}
.phero .meta{font-size:13px;color:var(--faint);margin-top:5px}
.pill{
  display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;border:1px solid var(--hair-2);color:var(--dim);background:var(--glass);
}
.dl .k{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.dl .v{font-size:15.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.dl .item + .item{margin-top:15px;padding-top:15px;border-top:1px solid var(--hair)}
.dl ul{margin:0;padding-inline-start:18px}
.dl li{margin:3px 0;font-size:15.5px;line-height:1.45}
.dl li::marker{color:var(--faint)}
.fact{display:flex;gap:12px;padding:13px 0;align-items:flex-start}
.fact + .fact{border-top:1px solid var(--hair)}
.fact .tx{flex:1;font-size:15.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.fact .dt{display:block;font-size:11px;color:var(--faint);margin-top:5px;letter-spacing:.04em}
.fact .x{color:var(--faint);font-size:20px;line-height:1;padding:0 4px;flex:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:10px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--hair);display:block}
.gal .cell{position:relative}
.gal .cell.is-av::after{
  content:'';position:absolute;top:7px;inset-inline-start:7px;width:8px;height:8px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);
}

/* ============================ review ============================ */
.rv{border:1px solid var(--hair);border-radius:var(--r);padding:15px;background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.055)}
.rv + .rv{margin-top:12px}
.rv.off{opacity:.4}
.rv-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rv-head input{flex:1;font-family:var(--serif);font-size:18px;min-height:40px;padding:8px 12px}
.badge{font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;padding:5px 9px;border-radius:7px;border:1px solid var(--hair-2);color:var(--dim);white-space:nowrap}
.badge.new{background:var(--white);color:#0A1523;border-color:var(--white)}
.tick{display:flex;gap:11px;align-items:flex-start;padding:10px 0;width:100%;text-align:start}
.tick + .tick{border-top:1px solid var(--hair)}
.box{
  width:23px;height:23px;border-radius:7px;border:1.5px solid var(--hair-2);flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#0A1523;transition:all .14s;
}
.box.on{background:var(--white);border-color:var(--white)}
.tick .k{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.tick .v{font-size:15px;line-height:1.45;word-break:break-word}
.tick .old{font-size:12px;color:var(--faint);text-decoration:line-through;margin-top:3px;display:block}
.tick .old.keep{text-decoration:none}
.rv-photo{flex:none;width:104px}
.rv-photo img{width:104px;height:104px;object-fit:cover;border-radius:14px;border:1px solid var(--hair);display:block}
.rv-photo select{margin-top:7px;min-height:36px;padding:6px 9px;font-size:13px;border-radius:10px}

/* ============================== the map ============================== */
:root{ --gold:#E9BE5C; --gold-dim:#B8933F; }
/* the map screen hands its whole area to the map and floats the rest on top */
main.map-view{padding:0;overflow:hidden}
.pmap-wrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--hair);background:#0A1421}
.map-view .pmap-wrap{height:100%;border:0;border-radius:0}
.map-top{position:absolute;top:0;left:0;right:0;padding:10px 12px 26px;
  background:linear-gradient(180deg,rgba(6,11,19,.78),rgba(6,11,19,0));pointer-events:none}
.map-top .chips{padding:0;pointer-events:auto}
.map-foot{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:flex-end;
  flex-wrap:wrap;pointer-events:none}
.map-pill{
  pointer-events:auto;font-size:12.5px;padding:8px 13px;border-radius:999px;
  background:rgba(10,18,32,.9);border:1px solid var(--hair-2);color:var(--dim);white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.map-pill.warn{color:var(--gold);border-color:rgba(233,190,92,.4)}
.map-pill.warn:active{background:rgba(233,190,92,.16)}
.pmap{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#0A1421}
.pmap:active{cursor:grabbing}
.pmap-tiles{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
/* OSM's own tiles, turned to fit a navy app: inverted, hue-flipped back to
   true, then cooled and dimmed so the pins stay the brightest thing. */
.pmap-tile{position:absolute;top:0;left:0;width:256px;height:256px;transform-origin:0 0;
  pointer-events:none;opacity:0;transition:opacity .22s ease-out;backface-visibility:hidden}
.pmap-tile.in{opacity:1}
.pmap-tile:not(.inv){filter:brightness(1.22) saturate(1.1)}
.pmap-tile.inv{filter:invert(1) hue-rotate(180deg) saturate(.55) brightness(.84) contrast(1.05)}
.pmap-pins{position:absolute;inset:0;pointer-events:none}
.pin{
  position:absolute;top:0;left:0;width:36px;height:36px;margin:-18px 0 0 -18px;pointer-events:auto;
  animation:pinIn .26s cubic-bezier(.2,1.3,.4,1) both;
  border-radius:50%;border:2px solid rgba(255,255,255,.85);background:#12233A;
  box-shadow:0 3px 12px rgba(0,0,0,.55);will-change:transform;
}
.pin-face{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;color:#C7D6EA;background:linear-gradient(160deg,#1B3151,#122238)}
.pin-face img{width:100%;height:100%;object-fit:cover;display:block}
.pin-kind{
  position:absolute;bottom:-4px;inset-inline-end:-4px;width:18px;height:18px;border-radius:50%;
  background:#0B1626;border:1.5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;
}
.pin-kind svg{width:11px;height:11px;fill:none;stroke:#DCE7F5;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}
.pin.cluster{background:#16294A;border-color:rgba(255,255,255,.9)}
.pin.cluster .pin-face{font-family:var(--sans);font-size:15px;font-weight:650;color:#fff;background:none}
.pin.star{border-color:var(--gold);box-shadow:0 3px 14px rgba(233,190,92,.4)}
.pin.star .pin-kind{border-color:var(--gold-dim)}
.pin:active .pin-face{transform:scale(.9)}
.pin-face{transition:transform .12s}
@keyframes pinIn{from{opacity:0}to{opacity:1}}
.pmap-credit{
  position:absolute;bottom:5px;inset-inline-end:9px;font-size:9.5px;color:rgba(190,205,225,.5);
  pointer-events:none;letter-spacing:.01em;
}
.pmap-zoom{position:absolute;top:10px;inset-inline-end:10px;display:flex;flex-direction:column;gap:6px}
.pmap-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--hair-2);background:#101C2E;
  font-size:19px;line-height:1;color:var(--fg);display:flex;align-items:center;justify-content:center;
}
.pmap-btn:active{background:rgba(255,255,255,.2)}
.pmap-banner{
  position:absolute;left:12px;right:12px;bottom:56px;padding:9px 12px;border-radius:12px;
  background:#101C2E;
  border:1px solid var(--hair-2);font-size:13px;color:var(--dim);
  display:none;align-items:center;gap:10px;
}
.pmap-banner.on{display:flex}
.pmap-banner.pick{color:var(--fg);border-color:rgba(255,255,255,.3)}
.banner-x{margin-inline-start:auto;color:var(--dim);font-size:13px;text-decoration:underline;white-space:nowrap}
.pmap-mini{display:block;width:100%;position:relative;height:168px;border-bottom:1px solid var(--hair)}
.pmap-mini #miniMap{position:absolute;inset:0}
.pmap-mini .pmap{pointer-events:none}
.pmap-mini-cta{
  position:absolute;bottom:9px;inset-inline-end:9px;font-size:12px;padding:6px 11px;border-radius:9px;
  background:rgba(10,20,34,.86);border:1px solid var(--hair-2);color:var(--fg);
}
.kindchip{
  width:34px;height:34px;flex:none;border-radius:11px;border:1px solid var(--hair);background:var(--glass);
  display:flex;align-items:center;justify-content:center;
}
.kindchip.small{width:26px;height:26px;border-radius:8px}
.kindchip svg{width:16px;height:16px;fill:none;stroke:var(--dim);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.kindchip.small svg{width:13px;height:13px}
.mini .nm{display:flex;flex-direction:column;gap:1px}
.mini .nm .sub{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================== the crown ============================= */
.crown{fill:none;stroke:currentColor;color:var(--faint);transition:color .18s,filter .18s}
.crown.on{color:var(--gold);fill:var(--gold);filter:drop-shadow(0 0 7px rgba(233,190,92,.45))}
.crown-btn{color:var(--faint)}
.crown-btn.on{color:var(--gold)}
.crown-btn:active{transform:scale(.9)}
.crown-mini{display:inline-flex;vertical-align:-2px;margin-inline-start:5px}
.chip .crown{vertical-align:-2px;margin-inline-end:2px}
.chip.on .crown{color:var(--gold-dim);fill:var(--gold-dim)}

#reinstall{
  position:fixed;left:10px;right:10px;bottom:10px;z-index:76;
  background:#1C2B14;border:1px solid rgba(190,230,140,.45);border-radius:12px;
  color:#D6EFB5;font-size:12.5px;line-height:1.5;padding:10px 13px;text-align:center;
}
/* only ever visible when the bar genuinely is not on the bottom edge */
#seal{
  position:fixed;left:0;right:0;bottom:0;z-index:75;background:var(--bar);
  border-top:1px dashed rgba(233,190,92,.5);color:var(--gold);
  font:400 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8px;
  -webkit-user-select:text;user-select:text;
}
.diag{
  margin:0;font:400 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--faint);white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;
}

/* ============================ modal ============================ */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(3,7,13,.82)}
#modal.on{display:flex}
.sheet{
  width:100%;max-width:520px;background:#0C1929;border-top:1px solid var(--hair-2);
  border-radius:24px 24px 0 0;padding:22px var(--pad-x) calc(var(--safe-b) + 22px);
  max-height:86dvh;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.3,1);box-shadow:0 -12px 40px rgba(0,0,0,.5);
}
@keyframes up{from{transform:translateY(28px);opacity:.3}}
.sheet h2{font-size:20px;margin-bottom:14px}
#viewer{position:fixed;inset:0;z-index:90;background:rgba(3,7,13,.97);display:none;align-items:center;justify-content:center}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:100dvh;object-fit:contain}
</style>
</head>

'use strict';
/* =====================================================================
   Palantir — a private memory for the people you know.
   One file, no build step, no server. Profiles and photos live in
   IndexedDB on this device. The only network call the app ever makes is
   the optional one you trigger yourself: sorting a brain-dump with the
   Claude API, using a key you paste in Settings.
   ===================================================================== */

/* ------------------------------ helpers ------------------------------ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const clean = a => (Array.isArray(a) ? a : []).map(v => String(v ?? '').trim()).filter(Boolean);
const uniq = a => Array.from(new Set(a.map(v => v.trim()).filter(Boolean)));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, ms = 2400){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), ms);
}

/* ------------------------------- places ------------------------------ */
/* Addresses are not a separate thing to maintain — they are read straight
   out of the fields you already fill in, so a profile lands on the map the
   moment you say where someone lives. `places` holds anything extra you add
   by hand; `pins` holds coordinates you set yourself, which always win. */
const PLACE_KINDS = ['home', 'family', 'work', 'former', 'school', 'other'];
const KIND_OF_FIELD = { residence: 'home', familyHome: 'family', currentWork: 'work',
                        formerWork: 'former', schools: 'school' };

/* Keys are derived from the text, never from its position in a list. An
   index-based key silently re-points a hand-placed pin at a different address
   the moment you delete an earlier entry — which is exactly how a deleted
   place appeared to linger on the map. */
const slug = s => String(s || '').toLowerCase().normalize('NFKD')
  .replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48);

function placesOf(p){
  const out = [], seen = new Set();
  const push = (kind, label, id) => {
    const l = String(label || '').trim();
    if (!l) return;
    let key = id ? 'extra:' + id : kind + ':' + slug(l);
    while (seen.has(key)) key += '_';
    seen.add(key);
    out.push({ key, kind, label: l, personId: p.id });
  };
  push('home', p.residence);
  push('family', p.familyHome);
  for (const [field, kind] of [['currentWork', 'work'], ['formerWork', 'former'], ['schools', 'school']])
    for (const v of p[field] || []) push(kind, v);
  for (const x of p.places || []) push(x.kind || 'other', x.label, x.id);
  return out;
}
/* coordinates you set by hand outlive edits to other fields, but not the
   disappearance of their own address */
function prunePins(p){
  if (!p.pins) return p;
  const live = new Set(placesOf(p).map(x => x.key));
  for (const k of Object.keys(p.pins)) if (!live.has(k)) delete p.pins[k];
  return p;
}
/* label → the string we hand the geocoder; a bare company name is hopeless
   without a city, so borrow the person's town when the label has no comma. */
function geoQuery(place, person){
  const l = place.label;
  if (/\d/.test(l) && l.includes(',')) return l;
  if (l.includes(',')) return l;
  const city = (person.residence || '').split(',')[0].trim();
  if (city && place.kind !== 'home' && place.kind !== 'family' && !l.toLowerCase().includes(city.toLowerCase()))
    return l + ', ' + city;
  return l;
}
const normQuery = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
function catLabel(id){
  if (DEFAULT_CATS.includes(id)) return t('cat.' + id);
  return id;
}
function allCats(){
  const extra = (state.settings.categories || []).filter(c => !DEFAULT_CATS.includes(c));
  return [...DEFAULT_CATS.filter(c => c !== 'other'), ...extra, 'other'];
}

/* ----------------------------- IndexedDB ----------------------------- */
const DB_NAME = 'palantir', DB_VER = 2;
let _db = null;
function db(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('people')) d.createObjectStore('people', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('photos')){
        const s = d.createObjectStore('photos', { keyPath: 'id' });
        s.createIndex('personId', 'personId');
      }
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      /* looked-up coordinates, keyed by the normalised query — one lookup per
         address ever, shared across everyone who lives on the same street */
      if (!d.objectStoreNames.contains('geo')) d.createObjectStore('geo');
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
const wrap = req => new Promise((res, rej) => {
  req.onsuccess = () => res(req.result);
  req.onerror = () => rej(req.error);
});
async function store(name, mode = 'readonly'){
  return (await db()).transaction(name, mode).objectStore(name);
}
const DB = {
  async all(name){ return wrap((await store(name)).getAll()); },
  async get(name, k){ return wrap((await store(name)).get(k)); },
  async put(name, v, k){ return wrap((await store(name, 'readwrite')).put(v, k)); },
  async del(name, k){ return wrap((await store(name, 'readwrite')).delete(k)); },
  async clear(name){ return wrap((await store(name, 'readwrite')).clear()); },
  async byPerson(personId){
    const s = await store('photos');
    return wrap(s.index('personId').getAll(personId));
  },
};

const urlCache = new Map();
function photoURL(photo){
  if (!photo) return '';
  if (urlCache.has(photo.id)) return urlCache.get(photo.id);
  const u = URL.createObjectURL(photo.blob);
  urlCache.set(photo.id, u);
  return u;
}
function forgetURL(id){
  const u = urlCache.get(id);
  if (u){ URL.revokeObjectURL(u); urlCache.delete(id); }
  photoRecCache.delete(id);
}

/* ---------------------------- image utils ---------------------------- */
async function loadBitmap(blob){
  if (window.createImageBitmap){
    try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); }
    catch { try { return await createImageBitmap(blob); } catch { /* fall through */ } }
  }
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(blob);
    img.onload = () => { URL.revokeObjectURL(u); res(img); };
    img.onerror = e => { URL.revokeObjectURL(u); rej(e); };
    img.src = u;
  });
}
async function resize(blob, maxEdge, quality){
  const bmp = await loadBitmap(blob);
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  const scale = Math.min(1, maxEdge / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  const out = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
  return { blob: out || blob, w, h };
}
function blobToDataURL(blob){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}
async function blobToBase64(blob){
  const d = await blobToDataURL(blob);
  return d.slice(d.indexOf(',') + 1);
}
function dataURLToBlob(u){
  const [head, b64] = u.split(',');
  const mime = /:(.*?);/.exec(head)[1];
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function ingestPhoto(file, personId){
  const { blob, w, h } = await resize(file, 1600, 0.85);
  const rec = { id: uid(), personId: personId || '', blob, w, h, createdAt: nowISO() };

}

/* ------------------------------- dates ------------------------------- */
/* Birthdays are stored as free text so nothing is ever lost, but we try to
   read a day and month out of them so the app can nudge you in advance. */
function parseBirthday(raw){
  const s = String(raw || '').trim();
  if (!s) return null;
  let m;
  if ((m = /^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(s)))
    return { y: +m[1], m: +m[2], d: +m[3] };
  if ((m = /^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/.exec(s)))
    return { y: +m[3], m: +m[2], d: +m[1] };
  if ((m = /^(\d{1,2})[-./](\d{1,2})$/.exec(s)))
    return { y: null, m: +m[2], d: +m[1] };
  if ((m = /^--(\d{2})-(\d{2})$/.exec(s)))
    return { y: null, m: +m[1], d: +m[2] };
  return null;
}
/* days until the next occurrence, plus the age reached on it */
function nextBirthday(b){
  if (!b || !b.m || !b.d) return null;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  let year = now.getFullYear();
  let next = new Date(year, b.m - 1, b.d);
  if (next < now){ year++; next = new Date(year, b.m - 1, b.d); }
  return { days: Math.round((next - now) / 86400000), age: b.y ? year - b.y : null };
}
function fmtBirthday(raw){
  const b = parseBirthday(raw);
  if (!b) return raw || '';
  const loc = state.lang === 'he' ? 'he-IL' : state.lang === 'pl' ? 'pl-PL' : 'en-GB';
  const d = new Date(b.y || 2000, b.m - 1, b.d);
  const opts = b.y ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'long' };
  try { return d.toLocaleDateString(loc, opts); } catch { return raw; }
}
function fmtDate(iso){
  if (!iso) return '';
  const loc = state.lang === 'he' ? 'he-IL' : state.lang === 'pl' ? 'pl-PL' : 'en-GB';
  try { return new Date(iso).toLocaleDateString(loc, { day: 'numeric', month: 'short', year: 'numeric' }); }
  catch { return iso.slice(0, 10); }
}
function fmtBytes(n){
  if (!n) return '0 KB';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0; while (n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  return (n < 10 && i > 0 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
}

/* ------------------------------- crypto ------------------------------ */
async function sha(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ===================================================================== */
/*                          geocoding & the map                          */
/* ===================================================================== */
/* Nominatim asks for at most one request a second, so lookups go through a
   queue and every answer is kept forever in the `geo` store. An address is
   therefore looked up once, ever — after that the map draws instantly and
   works offline. */
const NOMINATIM = 'https://nominatim.openstreetmap.org/search';
const geoMem = new Map();
let geoQueue = Promise.resolve(), geoPending = 0;

async function geoLookup(query){
  const key = normQuery(query);
  if (!key) return null;
  if (geoMem.has(key)) return geoMem.get(key);
  const stored = await DB.get('geo', key);
  if (stored){ geoMem.set(key, stored); return stored; }
  return null;
}
function geoResolve(query){
  const key = normQuery(query);
  if (!key) return Promise.resolve(null);
  geoPending++;
  geoQueue = geoQueue.then(async () => {
    const already = await geoLookup(key);
    if (already) return already;
    let hit = null;
    try {
      const url = NOMINATIM + '?format=jsonv2&limit=1&addressdetails=0&q=' + encodeURIComponent(query);
      const res = await fetch(url, { headers: { accept: 'application/json' } });
      if (res.ok){
        const [first] = await res.json();
        if (first) hit = { lat: +first.lat, lon: +first.lon, name: first.display_name || query, at: nowISO() };
      }
    } catch { /* offline, blocked, rate-limited — treated the same: unresolved */ }
    if (hit){ geoMem.set(key, hit); await DB.put('geo', hit, key); }
    else geoMem.set(key, null);       // remember the miss for this session only
    await sleep(1100);                // stay inside the usage policy
    return hit;
  }).finally(() => { geoPending--; });
  return geoQueue;
}

/* ------------------------- web-mercator maths ------------------------ */
const TILE = 256;
const lonToX = (lon, z) => (lon + 180) / 360 * TILE * Math.pow(2, z);
const latToY = (lat, z) => {
  const s = Math.sin(Math.max(-85.05, Math.min(85.05, lat)) * Math.PI / 180);
  return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * TILE * Math.pow(2, z);
};
const xToLon = (x, z) => x / (TILE * Math.pow(2, z)) * 360 - 180;
const yToLat = (y, z) => {
  const n = Math.PI - 2 * Math.PI * y / (TILE * Math.pow(2, z));
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
};

/* --------------------------- the map itself -------------------------- */
/* A few hundred lines instead of a mapping library. Two rules keep it
   smooth on a phone: nothing touches the DOM outside a requestAnimationFrame,
   and pins are moved rather than rebuilt — an innerHTML pass per pointermove
   is what makes a hand-rolled map feel like a slideshow. */
const TILE_SOURCES = [
  { url: (z, x, y) => `https://basemaps.cartocdn.com/dark_all/${z}/${x}/${y}.png`,
    credit: '© OpenStreetMap © CARTO' },
  { url: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
    credit: '© OpenStreetMap contributors', invert: true },
];

class Palamap {
  constructor(el, opts = {}){
    this.el = el;
    this.interactive = opts.interactive !== false;
    this.onPick = null;                 // set while placing a pin by hand
    this.onTap = opts.onTap || null;
    this.center = opts.center || { lat: 52.0, lon: 19.0 };
    this.zoom = opts.zoom ?? 4;
    this.minZoom = 2; this.maxZoom = 18;
    this.markers = [];
    this.tiles = new Map();             // "z/x/y" -> {img, z, x, y}
    this.pinEls = new Map();            // marker id -> element
    this.src = 0;
    this.loading = 0;
    this.queued = false;
    this.dead = 0; this.alive = false;

    el.classList.add('pmap');
    el.innerHTML = `<div class="pmap-tiles"></div><div class="pmap-pins"></div>
      <div class="pmap-credit">${esc(TILE_SOURCES[0].credit)}</div>`;
    this.layer = el.querySelector('.pmap-tiles');
    this.pins = el.querySelector('.pmap-pins');

    if (this.interactive) this.bind();
    this.ro = new ResizeObserver(() => this.draw());
    this.ro.observe(el);
  }

  destroy(){ this.ro.disconnect(); cancelAnimationFrame(this.raf); this.glide = null; }

  /* ------------------------------ input ----------------------------- */
  bind(){
    const el = this.el;
    const pts = new Map();
    let anchor = null, last = null, vx = 0, vy = 0;

    el.addEventListener('pointerdown', e => {
      if (e.target.closest('.pmap-btn, .pin')) return;
      this.glide = null;
      try { el.setPointerCapture(e.pointerId); } catch {}
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      anchor = { center: { ...this.center }, zoom: this.zoom, moved: 0,
                 pts: new Map([...pts].map(([k, v]) => [k, { ...v }])) };
      last = { x: e.clientX, y: e.clientY, t: performance.now() };
      vx = vy = 0;
    });

    el.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId) || !anchor) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const ids = [...anchor.pts.keys()].filter(id => pts.has(id));

      if (ids.length >= 2){
        const [a, b] = ids;
        const d0 = Math.hypot(anchor.pts.get(a).x - anchor.pts.get(b).x, anchor.pts.get(a).y - anchor.pts.get(b).y);
        const d1 = Math.hypot(pts.get(a).x - pts.get(b).x, pts.get(a).y - pts.get(b).y);
        if (d0 > 8) this.zoom = this.clampZoom(anchor.zoom + Math.log2(d1 / d0));
        const m0 = { x: (anchor.pts.get(a).x + anchor.pts.get(b).x) / 2, y: (anchor.pts.get(a).y + anchor.pts.get(b).y) / 2 };
        const m1 = { x: (pts.get(a).x + pts.get(b).x) / 2, y: (pts.get(a).y + pts.get(b).y) / 2 };
        this.panBy(m0.x - m1.x, m0.y - m1.y, anchor.center, this.zoom);
        anchor.moved += 20;
        vx = vy = 0;
      } else {
        const id = ids[0];
        const dx = pts.get(id).x - anchor.pts.get(id).x;
        const dy = pts.get(id).y - anchor.pts.get(id).y;
        anchor.moved = Math.max(anchor.moved, Math.hypot(dx, dy));
        this.panBy(-dx, -dy, anchor.center, this.zoom);
        const now = performance.now(), dt = Math.max(8, now - last.t);
        vx = (e.clientX - last.x) / dt; vy = (e.clientY - last.y) / dt;
        last = { x: e.clientX, y: e.clientY, t: now };
      }
      this.requestDraw();
    });

    const up = e => {
      const tapped = anchor && anchor.moved < 7;
      const speed = Math.hypot(vx, vy);
      pts.delete(e.pointerId);
      if (pts.size) return;
      if (tapped){
        const r = el.getBoundingClientRect();
        const at = this.unproject(e.clientX - r.left, e.clientY - r.top);
        if (this.onPick) this.onPick(at); else this.onTap?.(at);
      } else if (speed > 0.28){
        this.coast(vx, vy);                       // carry the flick
      }
      anchor = null;
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);

    el.addEventListener('wheel', e => {
      e.preventDefault();
      const r = el.getBoundingClientRect();
      this.zoomAround(e.clientX - r.left, e.clientY - r.top, -Math.sign(e.deltaY) * 0.55);
    }, { passive: false });

    el.addEventListener('dblclick', e => {
      const r = el.getBoundingClientRect();
      this.zoomAround(e.clientX - r.left, e.clientY - r.top, 1);
    });
  }

  /* momentum: velocity decays ~15% a frame, which reads as a natural glide */
  coast(vx, vy){
    const step = () => {
      if (!this.glide) return;
      vx *= 0.92; vy *= 0.92;
      if (Math.hypot(vx, vy) < 0.02){ this.glide = null; return; }
      this.panBy(-vx * 16, -vy * 16, this.center, this.zoom);
      this.requestDraw();
      this.glide = requestAnimationFrame(step);
    };
    this.glide = requestAnimationFrame(step);
  }

  clampZoom(z){ return Math.max(this.minZoom, Math.min(this.maxZoom, z)); }

  panBy(dx, dy, fromCenter, zoom){
    const cx = lonToX(fromCenter.lon, zoom) + dx;
    const cy = latToY(fromCenter.lat, zoom) + dy;
    const world = TILE * Math.pow(2, zoom);
    this.center = { lat: yToLat(Math.max(0, Math.min(world, cy)), zoom), lon: xToLon(cx, zoom) };
  }

  zoomAround(px, py, dz){
    const before = this.unproject(px, py);
    this.zoom = this.clampZoom(this.zoom + dz);
    const after = this.unproject(px, py);
    this.center = { lat: this.center.lat + (before.lat - after.lat),
                    lon: this.center.lon + (before.lon - after.lon) };
    this.draw();
  }

  size(){ const r = this.el.getBoundingClientRect(); return { w: r.width, h: r.height }; }

  unproject(px, py){
    const { w, h } = this.size(), z = this.zoom;
    return { lat: yToLat(latToY(this.center.lat, z) + py - h / 2, z),
             lon: xToLon(lonToX(this.center.lon, z) + px - w / 2, z) };
  }
  project(lat, lon){
    const { w, h } = this.size(), z = this.zoom;
    return { x: lonToX(lon, z) - lonToX(this.center.lon, z) + w / 2,
             y: latToY(lat, z) - latToY(this.center.lat, z) + h / 2 };
  }

  setMarkers(list){
    this.markers = list || [];
    const live = new Set(this.markers.map(m => m.id));
    for (const [id, el] of this.pinEls){
      if (!live.has(id)){ el.remove(); this.pinEls.delete(id); }
    }
    this.draw();
  }

  fit(list, pad = 62){
    const pts = (list || this.markers).filter(m => Number.isFinite(m.lat) && Number.isFinite(m.lon));
    if (!pts.length) return;
    const { w, h } = this.size();
    if (!w || !h) return;
    if (pts.length === 1){
      this.center = { lat: pts[0].lat, lon: pts[0].lon };
      this.zoom = this.clampZoom(13);
      this.draw();
      return;
    }
    const lats = pts.map(p => p.lat), lons = pts.map(p => p.lon);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const minLon = Math.min(...lons), maxLon = Math.max(...lons);
    let z = this.maxZoom;
    for (; z > this.minZoom; z--){
      const dx = Math.abs(lonToX(maxLon, z) - lonToX(minLon, z));
      const dy = Math.abs(latToY(minLat, z) - latToY(maxLat, z));
      if (dx <= w - pad * 2 && dy <= h - pad * 2) break;
    }
    this.center = { lat: (minLat + maxLat) / 2, lon: (minLon + maxLon) / 2 };
    this.zoom = this.clampZoom(z);
    this.draw();
  }

  /* ------------------------------ paint ----------------------------- */
  /* rAF coalesces a gesture's flood of updates, but it does not fire while
     the page is hidden or throttled — so anything the user just asked for
     paints synchronously and only continuous movement waits for a frame. */
  requestDraw(){
    if (document.hidden){ this.draw(); return; }
    if (this.queued) return;
    this.queued = true;
    this.raf = requestAnimationFrame(() => { this.queued = false; this.draw(); });
  }

  draw(){
    const { w, h } = this.size();
    if (!w || !h) return;
    const zt = Math.max(this.minZoom, Math.min(this.maxZoom, Math.round(this.zoom)));
    const scale = Math.pow(2, this.zoom - zt);
    const ox = w / 2 - lonToX(this.center.lon, zt) * scale;
    const oy = h / 2 - latToY(this.center.lat, zt) * scale;

    const n = Math.pow(2, zt);
    const x0 = Math.floor(-ox / scale / TILE), x1 = Math.ceil((w - ox) / scale / TILE);
    const y0 = Math.max(0, Math.floor(-oy / scale / TILE)), y1 = Math.min(n, Math.ceil((h - oy) / scale / TILE));
    const src = TILE_SOURCES[this.src];

    for (let x = x0; x < x1; x++){
      for (let y = y0; y < y1; y++){
        const wx = ((x % n) + n) % n;
        const id = `${zt}/${wx}/${y}/${x}`;
        if (this.tiles.has(id)) continue;
        const img = new Image();
        img.className = 'pmap-tile' + (src.invert ? ' inv' : '');
        img.decoding = 'async';
        img.alt = '';
        this.loading++;
        img.addEventListener('load', () => {
          img.classList.add('in'); this.alive = true; this.loading--;
        }, { once: true });
        img.addEventListener('error', () => {
          this.loading--; this.dead++;
          /* one provider down should not mean no map at all */
          if (!this.alive && this.dead > 3 && this.src < TILE_SOURCES.length - 1){
            this.src++; this.dead = 0;
            for (const [k, t] of this.tiles){ t.img.remove(); this.tiles.delete(k); }
            this.el.querySelector('.pmap-credit').textContent = TILE_SOURCES[this.src].credit;
            this.requestDraw();
          }
        }, { once: true });
        img.src = src.url(zt, wx, y);
        this.layer.appendChild(img);
        this.tiles.set(id, { img, z: zt, x, y });
      }
    }

    /* place every tile, including ones from the previous zoom, so a zoom
       step never blinks through to an empty canvas */
    for (const [id, tl] of this.tiles){
      const k = Math.pow(2, zt - tl.z) * scale;
      const px = tl.x * TILE * k + ox, py = tl.y * TILE * k + oy;
      const span = TILE * k;
      if (px > w + span || py > h + span || px < -span * 2 || py < -span * 2){
        if (tl.z !== zt){ tl.img.remove(); this.tiles.delete(id); continue; }
      }
      tl.img.style.transform = `translate3d(${px}px,${py}px,0) scale(${k})`;
      tl.img.style.zIndex = tl.z === zt ? 1 : 0;
    }
    if (!this.loading){
      for (const [id, tl] of this.tiles){
        if (tl.z !== zt){ tl.img.remove(); this.tiles.delete(id); }
      }
    }
    this.drawPins(w, h);
    this.onMove?.();
  }

  /* Pins are created once and then only moved. Anything closer together than
     a pin's own width is collapsed into a count — four places in one city
     used to stack into an unreadable pile. */
  drawPins(w, h){
    const vis = [];
    for (const m of this.markers){
      if (!Number.isFinite(m.lat) || !Number.isFinite(m.lon)) continue;
      const { x, y } = this.project(m.lat, m.lon);
      if (x < -70 || y < -70 || x > w + 70 || y > h + 70) continue;
      vis.push({ m, x, y });
    }

    const R = 40, groups = [];
    for (const v of vis){
      const near = groups.find(g => Math.hypot(g.x - v.x, g.y - v.y) < R);
      if (near){
        near.items.push(v);
        near.x = near.items.reduce((a, i) => a + i.x, 0) / near.items.length;
        near.y = near.items.reduce((a, i) => a + i.y, 0) / near.items.length;
      } else groups.push({ x: v.x, y: v.y, items: [v] });
    }

    const wanted = new Set();
    for (const g of groups){
      const single = g.items.length === 1;
      const key = single ? g.items[0].m.id : 'cluster:' + g.items.map(i => i.m.id).sort().join(',');
      wanted.add(key);
      let el = this.pinEls.get(key);
      if (!el){
        el = document.createElement('button');
        if (single){
          const m = g.items[0].m;
          el.className = 'pin' + (m.starred ? ' star' : '');
          el.dataset.act = 'mapPin';
          el.dataset.pinid = m.id;
          el.title = m.title || '';
          el.innerHTML = `<span class="pin-face">${m.face}</span>
            <span class="pin-kind">${KIND_GLYPH[m.kind] || KIND_GLYPH.other}</span>`;
        } else {
          const anyStar = g.items.some(i => i.m.starred);
          el.className = 'pin cluster' + (anyStar ? ' star' : '');
          el.dataset.act = 'mapCluster';
          /* opening a cluster frames what is inside it, rather than zooming
             blindly and leaving you looking at empty sea */
          const la = g.items.map(i => i.m.lat), lo = g.items.map(i => i.m.lon);
          el.dataset.bbox = [Math.min(...la), Math.min(...lo), Math.max(...la), Math.max(...lo)].join(',');
          el.title = g.items.map(i => i.m.title).join(', ');
          el.innerHTML = `<span class="pin-face">${g.items.length}</span>`;
        }
        this.pins.appendChild(el);
        this.pinEls.set(key, el);
      }
      el.style.transform = `translate3d(${Math.round(g.x)}px,${Math.round(g.y)}px,0)`;
    }
    for (const [key, el] of this.pinEls){
      if (!wanted.has(key)){ el.remove(); this.pinEls.delete(key); }
    }
  }
}

const API_URL = 'https://api.anthropic.com/v1/messages';

function extractionSchema(cats){
  const str = { type: 'string' };
  const arr = { type: 'array', items: { type: 'string' } };
  const fieldProps = {};
  for (const f of FIELDS) fieldProps[f.api] = f.kind === 'list' ? arr : str;
  return {
    type: 'object',
    properties: {
      entries: {
        type: 'array',
        items: {
          type: 'object',
          properties: {
            match_id: str,
            name: str,
            category: { type: 'string', enum: cats },
            fields: { type: 'object', properties: fieldProps, required: Object.keys(fieldProps), additionalProperties: false },
            facts: arr,
            photo_indexes: { type: 'array', items: { type: 'integer' } },
          },
          required: ['match_id', 'name', 'category', 'fields', 'facts', 'photo_indexes'],
          additionalProperties: false,
        },
      },
      leftovers: arr,
    },
    required: ['entries', 'leftovers'],
    additionalProperties: false,
  };
}

function systemPrompt(cats){
  const roster = state.people.map(p => ({
    id: p.id, name: p.name, aka: p.aka, category: p.category,
    lives: p.residence || undefined, work: (p.currentWork || [])[0] || undefined,
  }));
  const langName = { en: 'English', pl: 'Polish', he: 'Hebrew' }[state.lang] || 'English';
  return [
    'You sort a person\'s spoken or typed notes into profiles of the people they know.',
    'Today is ' + new Date().toISOString().slice(0, 10) + '. The user writes in ' + langName + ' but may mix languages.',
    '',
    'Return one entry per person mentioned in the note.',
    '- match_id: the id of an existing person from the roster below when the note is clearly about them (same name, nickname, or unmistakable context). Otherwise "".',
    '- name: the person\'s name as the user would write it. For an existing person, repeat their stored name.',
    '- category: pick from ' + cats.join(', ') + '. Keep an existing person\'s category unless the note plainly says otherwise.',
    '- fields: only what the note actually states. Leave a string "" and a list [] when the note says nothing. Never guess, never carry information over from one person to another.',
    '  birthday: normalise to YYYY-MM-DD, or MM-DD when the year is unknown; keep any extra wording out of it.',
    '  current_work / former_work: "Role at Company" or just the company. Move a job to former_work when the note says they left it.',
    '  schools: universities and schools they attended, by name.',
    '  residence / family_home / current_work / former_work / schools go on a map, so keep a town or city in them when the note gives one — "Deloitte, Warsaw" rather than "Deloitte".',
    '  relationships: family members and partners, e.g. "sister Maja", "wife Ola".',
    '- facts: everything else worth remembering, one short sentence each, in the language the user used. Write them as standalone statements — the user will read them months from now. Do not repeat something already captured in fields.',
    '- photo_indexes: indexes of the attached photos that show or belong to this person, based on what the note says about them. Use [] when unsure.',
    '',
    'leftovers: any part of the note that is not about a specific person. Use [] when there is none.',
    'Say nothing outside the JSON.',
    '',
    'Roster of people already on file (JSON):',
    JSON.stringify(roster),
  ].join('\n');
}

async function callClaude(body){
  const key = (state.settings.apiKey || '').trim();
  if (!key) throw new Error('NO_KEY');
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify(body),
  });
  const text = await res.text();
  let json = null;
  try { json = JSON.parse(text); } catch { /* keep raw */ }
  if (!res.ok){
    const msg = json?.error?.message || text.slice(0, 300) || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return json;
}

function firstText(msg){
  for (const b of msg?.content || []) if (b.type === 'text' && b.text) return b.text;
  return '';
}
function parseJSONLoose(s){
  try { return JSON.parse(s); } catch { /* try harder */ }
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a){ try { return JSON.parse(s.slice(a, b + 1)); } catch { /* no */ } }
  return null;
}

async function sortWithAI(){
  const cats = allCats();
  const content = [];
  for (const ph of state.draft.photos){
    const small = await resize(ph.blob, 1400, 0.82);
    content.push({
      type: 'image',
      source: { type: 'base64', media_type: 'image/jpeg', data: await blobToBase64(small.blob) },
    });
  }
  const note = state.draft.text.trim();
  content.push({
    type: 'text',
    text: (state.draft.photos.length
      ? 'Attached photos, in order, are indexes 0..' + (state.draft.photos.length - 1) + '.\n\n'
      : '') + 'Note:\n' + (note || '(no text — work from the photos alone)'),
  });

  const model = state.settings.model || DEFAULT_MODEL;
  const output_config = { format: { type: 'json_schema', schema: extractionSchema(cats) } };
  if (takesEffort(model)) output_config.effort = 'medium';

  const msg = await callClaude({
    model, max_tokens: 8000,
    system: systemPrompt(cats),
    messages: [{ role: 'user', content }],
    output_config,
  });

  if (msg.stop_reason === 'refusal') throw new Error('The model declined to answer that note.');
  const data = parseJSONLoose(firstText(msg));
  if (!data || !Array.isArray(data.entries)) throw new Error('Unexpected answer from the model.');
  return data;
}

/* Build the reviewable proposal from the model's answer. */
function buildReview(data){
  const entries = [];
  for (const e of data.entries || []){
    const name = String(e.name || '').trim();
    if (!name) continue;
    const existing = e.match_id ? state.people.find(p => p.id === e.match_id) : null;
    const changes = [];
    for (const f of FIELDS){
      const raw = (e.fields || {})[f.api];
      if (f.kind === 'list'){
        const vals = uniq(clean(raw));
        const have = existing ? (existing[f.k] || []) : [];
        const add = vals.filter(v => !have.some(h => h.toLowerCase() === v.toLowerCase()));
        if (add.length) changes.push({ key: f.k, kind: 'list', value: add, old: have.join(', '), on: true });
      } else {
        const v = String(raw ?? '').trim();
        if (!v) continue;
        const old = existing ? String(existing[f.k] || '') : '';
        if (old.trim().toLowerCase() === v.toLowerCase()) continue;
        changes.push({ key: f.k, kind: 'text', value: v, old, on: true });
      }
    }
    const facts = clean(e.facts).map(text => ({ text, on: true }));
    const photos = (Array.isArray(e.photo_indexes) ? e.photo_indexes : [])
      .map(i => state.draft.photos[i]).filter(Boolean).map(p => p.id);
    if (!changes.length && !facts.length && !photos.length && existing) continue;
    entries.push({
      id: uid(),
      on: true,
      name,
      matchId: existing ? existing.id : '',
      category: (e.category && allCats().includes(e.category)) ? e.category
              : (existing ? existing.category : 'other'),
      changes, facts, photos,
    });
  }
  const claimed = new Set(entries.flatMap(e => e.photos));
  const loose = state.draft.photos.filter(p => !claimed.has(p.id)).map(p => p.id);
  if (loose.length && entries.length) entries[0].photos.push(...loose);
  return { entries, leftovers: clean(data.leftovers), at: nowISO() };
}

async function applyReview(){
  const rev = state.review;
  if (!rev) return 0;
  let n = 0;
  for (const e of rev.entries){
    if (!e.on) continue;
    let p = e.matchId ? state.people.find(x => x.id === e.matchId) : null;
    if (!p){ p = blankPerson(); p.name = e.name.trim(); }
    else if (e.name.trim() && e.name.trim() !== p.name){
      p.aka = uniq([...(p.aka || []), e.name.trim()].filter(v => v !== p.name));
    }
    p.category = e.category || p.category;
    for (const c of e.changes){
      if (!c.on) continue;
      if (c.kind === 'list') p[c.key] = uniq([...(p[c.key] || []), ...c.value]);
      else p[c.key] = c.value;
    }
    for (const f of e.facts){
      if (!f.on) continue;
      p.facts = p.facts || [];
      p.facts.push({ id: uid(), text: f.text, at: nowISO() });
    }
    await savePerson(p);
    for (const photoId of e.photos){
      const rec = await DB.get('photos', photoId);
      if (!rec) continue;
      rec.personId = p.id;
      await DB.put('photos', rec);
      if (!p.avatarId){ p.avatarId = rec.id; await savePerson(p); }
      invalidatePhotos(p.id);
      state.draft.photos = state.draft.photos.filter(x => x.id !== photoId);
    }
    n++;
  }
  for (const ph of state.draft.photos){ forgetURL(ph.id); await DB.del('photos', ph.id); }
  state.draft = { text: '', photos: [] };
  await DB.put('meta', { text: '' }, 'draft');
  state.review = null;
  await DB.del('meta', 'review');
  return n;
}

async function pressKey(k){
  const lock = $('#lock');

  $('#lockMsg').textContent = '';
  if (k === 'del'){ entered = entered.slice(0, -1); paintDots(); return; }
  if (entered.length >= 4) return;
  entered += k;
  paintDots();
  if (entered.length === 4){

    if (ok){

      if (navigator.vibrate) navigator.vibrate(60);

/* If the tab bar is not sitting on the bottom edge, say so on screen with the
   numbers rather than leaving it to be described. Nobody sees this unless the
   gap is real; when it is, one screenshot carries the whole diagnosis. */
function checkSeal(){
  const bar = $('#tabs');
  if (!bar || !$('#app').classList.contains('on')) return;
  /* An icon added while the status-bar mode was wrong carries a window that
     ends above the bottom of the glass — nothing rendered here can reach the
     dead strip below it. Detectable: iOS standalone, window shorter than the
     screen. Say so where the band starts, on the device, in its language. */
  const brokenWrapper = navigator.standalone === true && (screen.height - window.innerHeight) > 50;
  let note = $('#reinstall');
  if (brokenWrapper){
    if (!note){
      note = document.createElement('div');
      note.id = 'reinstall';
      document.body.appendChild(note);
    }
    note.textContent = t('ios.reinstall');
  } else note?.remove();
  const r = bar.getBoundingClientRect();
  const gap = Math.round(window.innerHeight - r.bottom);
  let strip = $('#seal');
  if (gap <= 1){ strip?.remove(); return; }
  if (!strip){
    strip = document.createElement('div');
    strip.id = 'seal';
    document.body.appendChild(strip);
  }
  strip.style.height = gap + 'px';
  strip.textContent = `gap ${gap}px · vh ${window.innerHeight} · bar ${Math.round(r.top)}–${Math.round(r.bottom)}` +
    ` · app ${Math.round($('#app').getBoundingClientRect().bottom)} · dpr ${devicePixelRatio}`;
}

async function runSort(){
  if (!state.draft.text.trim() && !state.draft.photos.length){ toast(t('cap.empty')); return; }
  const btn = $('#sortBtn');
  btn.disabled = true;
  $('#sortLabel').innerHTML = `<span class="spin"></span> ${esc(t('cap.sorting'))}`;
  try {
    const data = await sortWithAI();
    const review = buildReview(data);
    if (!review.entries.length && !review.leftovers.length){ toast(t('rev.none')); return; }
    state.review = review;
    await DB.put('meta', review, 'review');
    go('#/review');
  } catch (err){
    console.error(err);
    toast(err.message === 'NO_KEY' ? t('cap.noKey') : (err.message || t('c.error')), 5200);
  } finally {
    btn.disabled = false;
    $('#sortLabel').textContent = t('cap.sort');

/* dictation */
let recog = null;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  if (state.listening){ recog?.stop(); return; }
  recog = new SR();
  recog.lang = SPEECH_LOCALE[state.lang] || 'en-US';
  recog.continuous = true;
  recog.interimResults = true;
  let base = state.draft.text;
  recog.onresult = e => {
    let finalTx = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal) finalTx += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (finalTx){
      base = (base ? base.replace(/\s+$/, '') + ' ' : '') + finalTx.trim();
      state.draft.text = base;
      saveDraftSoon();
    }
    const ta = $('#draft');
    if (ta){ ta.value = base + (interim ? ' ' + interim : ''); ta.scrollTop = ta.scrollHeight; }
  };
  recog.onerror = e => { toast(String(e.error || t('c.error'))); };
  recog.onend = () => { state.listening = false; $('#micBtn')?.classList.remove('rec'); };
  try { recog.start(); state.listening = true; $('#micBtn')?.classList.add('rec'); }
  catch { toast(t('c.error')); }
}

/* ================================= map ================================ */
/* Everyone's addresses on one canvas. The chip row is the "map per group"
   the same way the People tab filters: All / crowned / one category. */
async function collectPins(scope){
  const kinds = state.settings.mapKinds || PLACE_KINDS;
  const people = state.people.filter(p => {
    if (scope.personId) return p.id === scope.personId;
    if (scope.group === 'fav') return !!p.starred;
    if (scope.group && scope.group !== 'all') return p.category === scope.group;
    return true;
  });

  const out = [], missing = [];
  for (const p of people){
    for (const place of placesOf(p)){
      if (!kinds.includes(place.kind)) continue;
      const pinned = (p.pins || {})[place.key];
      const query = geoQuery(place, p);
      const hit = pinned || await geoLookup(query);
      const rec = { id: p.id + '|' + place.key, personId: p.id, key: place.key,
                    kind: place.kind, label: place.label, query,
                    starred: !!p.starred, title: p.name + ' — ' + place.label,
                    manual: !!pinned };
      if (hit){ out.push({ ...rec, lat: hit.lat, lon: hit.lon }); }
      else missing.push(rec);
    }
  }
  return { pins: out, missing, people };
}

function pinFace(p){
  const rec = photoRecCache.get(p.avatarId);
  if (rec) return `<img src="${photoURL(rec)}" alt="">`;
  const initials = (p.name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
  return `<span>${esc(initials || '?')}</span>`;
}

          ${c === 'fav' ? CROWN(13) + ' ' : ''}${esc(c === 'all' ? t('ppl.all') : c === 'fav' ? t('map.fav') : catLabel(c))}</button>`).join('')}</div></div>` : ''}
      <div class="pmap-zoom">

      </div>
      <div class="map-foot"><div class="map-pill" id="mapCount"></div><div id="mapMissing"></div></div>
      <div class="pmap-banner" id="mapBanner"></div>
    </div>
  `;

  const el = $('#pmap');
  const saved = state.mapView;
  state.map = new Palamap(el, { center: saved?.center, zoom: saved?.zoom });
  state.map.onMove = () => { state.mapView = { center: { ...state.map.center }, zoom: state.map.zoom }; };
  await paintMap(scope);
}

async function paintMap(scope){
  state.mapScope = scope;
  const { pins, missing, people } = await collectPins(scope);
  if (!state.map) return;
  state.map.setMarkers(pins.map(p => ({ ...p, face: pinFace(state.people.find(x => x.id === p.personId) || {}) })));
  if (!state.mapView || state.mapFitPending !== JSON.stringify(scope)){
    state.map.fit(pins);
    state.mapFitPending = JSON.stringify(scope);
  }

  state.mapMissing = missing;
  const count = $('#mapCount');
  if (count){
    count.textContent = pins.length
      ? t('map.count', { places: pins.length, people: new Set(pins.map(p => p.personId)).size })
      : t('map.noPlaces').split('\n')[0];
  }
  const miss = $('#mapMissing');
  if (miss){
    miss.innerHTML = missing.length
      ? `<button class="map-pill warn" data-act="missingList">${esc(t('map.missing', { n: missing.length }))}</button>` : '';
  }
  const banner = $('#mapBanner');
  if (banner && !state.picking){
    const offline = (state.map.dead || 0) > 2 && !state.map.alive;
    const msg = geoPending ? t('map.locating', { n: geoPending }) : offline ? t('map.offline') : '';
    banner.textContent = msg;
    banner.classList.toggle('on', !!msg);
  }

  /* look up whatever is still unplaced, refreshing as answers land */
  if (missing.length){
    const todo = missing.filter(m => !geoMem.has(normQuery(m.query)));
    for (const m of todo){
      geoResolve(m.query).then(() => {
        if (state.mapScope === scope) paintMap(scope);
      });
    }
    if (banner && geoPending){ banner.textContent = t('map.locating', { n: geoPending }); banner.classList.add('on'); }
  }
}

    <path d="M3.6 8.4 8 11.6 12 5.2l4 6.4 4.4-3.2-1.5 9.2H5.1z"/><path d="M5.6 20.4h12.8"/></svg>`;
}

async function paintPeopleList(){
  const box = $('#plist');
  if (!box) return;
  const q = state.query.trim().toLowerCase();
  const inFilter = p => state.filter === 'all' ? true
                      : state.filter === 'fav' ? !!p.starred
                      : p.category === state.filter;
  const hay = p => [p.name, ...(p.aka || []), catLabel(p.category),
      ...FIELDS.map(f => Array.isArray(p[f.k]) ? p[f.k].join(' ') : p[f.k]),
      ...(p.facts || []).map(f => f.text)].join(' ').toLowerCase();
  /* crowned people float to the top of every list */
  const list = state.people.filter(p => inFilter(p) && (!q || hay(p).includes(q)))
    .sort((a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0));
  const flip = document.documentElement.dir === 'rtl' ? 'transform:scaleX(-1)' : '';

  const rows = await Promise.all(list.map(async p => {
    const bits = [catLabel(p.category), (p.currentWork || [])[0], p.residence].filter(Boolean);
    return `<button class="prow" data-go="#/person/${p.id}">
      ${await avatarHTML(p)}

    </button>`;
  }));

  box.classList.toggle('plist', list.length > 0);
  box.innerHTML = list.length ? rows.join('')
    : emptyBlock(esc(state.people.length ? t('ppl.none') : t('ppl.empty')).replace(/\n/g, '<br>'));
  $('#pcount').textContent = list.length
    ? (list.length === 1 ? t('ppl.count1') : t('ppl.count', { n: list.length })) : '';
}

  for (const pl of places){
    if (placePins.some(x => x.key === pl.key)) continue;

    if (geoMem.has(normQuery(q))) continue;

/* ------------------------------ backup ------------------------------- */
async function exportData(){
  const photos = await DB.all('photos');
  const geoKeys = await wrap((await store('geo')).getAllKeys());
  const geoVals = await DB.all('geo');
  const out = {
    app: 'palantir', version: 2, exportedAt: nowISO(),
    settings: { lang: state.settings.lang, model: state.settings.model,
                categories: state.settings.categories, mapKinds: state.settings.mapKinds },
    people: state.people,
    geo: geoKeys.map((k, i) => [k, geoVals[i]]),   // so a restore draws the map at once
    photos: [],
  };
  for (const ph of photos){
    if (ph.personId === '__draft__' || !ph.personId) continue;
    out.photos.push({ id: ph.id, personId: ph.personId, w: ph.w, h: ph.h, createdAt: ph.createdAt,
                      data: await blobToDataURL(ph.blob) });
  }
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'palantir-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function pickFile(accept, multiple = false){
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept; i.multiple = multiple;
    i.style.position = 'fixed'; i.style.left = '-9999px';
    document.body.appendChild(i);
    i.addEventListener('change', () => { res(Array.from(i.files || [])); i.remove(); }, { once: true });
    i.click();
  });
}

async function importData(){
  const [file] = await pickFile('application/json,.json');
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast(t('set.badFile')); return; }
  if (!data || data.app !== 'palantir' || !Array.isArray(data.people)){ toast(t('set.badFile')); return; }
  if (!await confirmSheet(t('set.import'), t('set.importQ'))) return;

  for (const u of urlCache.values()) URL.revokeObjectURL(u);
  urlCache.clear();
  photoRecCache.clear();
  await DB.clear('people'); await DB.clear('photos');
  for (const p of data.people) await DB.put('people', p);
  geoMem.clear();
  for (const [k, v] of data.geo || []) { if (k && v) await DB.put('geo', v, k); }
  for (const ph of data.photos || []){
    try {
      await DB.put('photos', { id: ph.id, personId: ph.personId, w: ph.w, h: ph.h,
                               createdAt: ph.createdAt, blob: dataURLToBlob(ph.data) });
    } catch { /* skip a broken photo rather than lose the whole restore */ }
  }
  if (data.settings){
    state.settings.categories = data.settings.categories || [];
    state.settings.model = data.settings.model || state.settings.model;
    state.settings.mapKinds = data.settings.mapKinds || state.settings.mapKinds;
    await saveSettings();
  }
  state.photosOf.clear();
  await loadPeople();
  toast(t('set.imported', { n: data.people.length }));
  render();
}

async function wipeAll(){
  if (!await confirmSheet(t('set.wipe'), t('set.wipeQ'))) return;
  for (const u of urlCache.values()) URL.revokeObjectURL(u);
  urlCache.clear();
  photoRecCache.clear();
  await DB.clear('people'); await DB.clear('photos'); await DB.clear('meta'); await DB.clear('geo');
  geoMem.clear();
  state.people = []; state.photosOf.clear(); state.review = null;
  state.draft = { text: '', photos: [] };
  state.settings.pass = await sha('3671');
  state.settings.apiKey = '';
  state.settings.categories = [];
  await saveSettings();
  toast(t('c.done'));
  if (location.hash === '#/capture') render(); else go('#/capture');
}
