<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Palantir</title>
<meta name="description" content="Everything you know about the people you know.">
<meta name="theme-color" content="#0B1626">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palantir">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-64.png" sizes="64x64" type="image/png">
<style>
/* ============================ palette & base ============================ */
:root{
  --bg:#080F1A;
  --bg-2:#0B1626;
  --surface:#0F1D31;
  --card:#101F35;
  --card-hi:#16294A;
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.16);
  --fg:#EDF2F9;
  --dim:#9AAAC1;
  --faint:#63738C;
  --white:#fff;
  --danger:#FF8A80;
  --r:16px;
  --r-sm:11px;
  --tap:44px;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',Georgia,serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --tabs-h:58px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:400 16px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent;
  min-height:100dvh;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none}
input,textarea,select{-webkit-appearance:none;appearance:none}
a{color:inherit}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;letter-spacing:.01em}
::selection{background:rgba(255,255,255,.22)}
.u-sel{-webkit-user-select:text;user-select:text}
.chrome{-webkit-user-select:none;user-select:none}

/* ============================ lock screen ============================ */
#lock{
  position:fixed;inset:0;z-index:60;background:var(--bg-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 26px);
  gap:22px;
}
#lock.hide{display:none}
.mark{display:block}
.mark path,.mark circle{transition:opacity .2s}
.lock-name{font-family:var(--serif);font-size:27px;letter-spacing:.06em;text-transform:uppercase}
.lock-sub{color:var(--faint);font-size:13.5px;margin-top:-14px;letter-spacing:.02em}
.dots{display:flex;gap:15px;margin:6px 0 2px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);transition:background .15s,transform .15s,border-color .15s}
.dot.on{background:var(--white);border-color:var(--white);transform:scale(1.08)}
#lock.err .dots{animation:shake .4s}
@keyframes shake{10%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-4px)}}
.lock-msg{min-height:20px;font-size:13.5px;color:var(--danger)}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 22px;justify-content:center}
.key{
  height:78px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.035);
  font-size:29px;font-weight:300;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,transform .08s;
}
.key:active{background:rgba(255,255,255,.15);transform:scale(.95)}
.key.blank{border:0;background:none;pointer-events:none}
.key.fn{font-size:15px;border-color:transparent;background:none;color:var(--dim)}

/* ============================ app frame ============================ */
#app{display:none;flex-direction:column;min-height:100dvh}
#app.on{display:flex}
#topbar{
  position:sticky;top:0;z-index:30;
  padding:calc(var(--safe-t) + 10px) calc(var(--safe-r) + 16px) 10px calc(var(--safe-l) + 16px);
  background:rgba(8,15,26,.82);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;min-height:52px;
}
.tb-title{font-family:var(--serif);font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-btn{
  min-width:var(--tap);height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  color:var(--fg);font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(255,255,255,.05);white-space:nowrap;
}
.tb-btn:active{background:rgba(255,255,255,.14)}
.tb-btn.plain{border-color:transparent;background:none;padding:0 6px;min-width:34px}
.tb-btn.strong{background:var(--white);color:#0B1626;border-color:var(--white);font-weight:600}
.tb-btn[disabled]{opacity:.4}
main{
  flex:1;min-height:0;
  padding:18px calc(var(--safe-r) + 16px) calc(var(--tabs-h) + var(--safe-b) + 30px) calc(var(--safe-l) + 16px);
  -webkit-overflow-scrolling:touch;
}
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px calc(var(--safe-r) + 8px) calc(var(--safe-b) + 6px) calc(var(--safe-l) + 8px);
  background:rgba(8,15,26,.9);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-top:1px solid var(--line);
}
#app:not(.on) ~ #tabs, #tabs.hide{display:none}
.tab{
  height:var(--tap);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--faint);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--white)}
.tab:active{background:rgba(255,255,255,.07)}

/* ============================ building blocks ============================ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.card + .card{margin-top:12px}
.sec{margin:26px 0 10px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.sec:first-child{margin-top:2px}
.btn{
  min-height:var(--tap);padding:0 18px;border-radius:12px;border:1px solid var(--line-2);
  display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:15.5px;
  background:rgba(255,255,255,.05);width:100%;
}
.btn:active{background:rgba(255,255,255,.14)}
.btn.primary{background:var(--white);color:#0B1626;border-color:var(--white);font-weight:600}
.btn.primary:active{background:#D8E2EF}
.btn.ghost{background:none}
.btn.danger{color:var(--danger);border-color:rgba(255,138,128,.4)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.small{min-height:36px;font-size:14px;padding:0 13px;width:auto;border-radius:10px}
.row{display:flex;gap:10px}
.row > *{flex:1}
input[type=text],input[type=password],input[type=search],textarea,select{
  width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:11px 13px;font-size:16px;color:var(--fg);
  min-height:var(--tap);line-height:1.4;
}
textarea{resize:vertical;min-height:96px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--line-2);background:rgba(255,255,255,.08)}
input::placeholder,textarea::placeholder{color:var(--faint)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir=rtl] select{background-position:18px 50%,13px 50%}
.lbl{display:block;font-size:12.5px;color:var(--dim);margin:0 0 6px 2px;letter-spacing:.02em}
.field + .field{margin-top:13px}
.hint{font-size:12.5px;color:var(--faint);line-height:1.5;margin-top:7px}
.empty{text-align:center;color:var(--faint);padding:46px 20px;font-size:14.5px;line-height:1.6}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 11px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12.5px;color:var(--dim);white-space:nowrap;
}
.chip.on{background:var(--white);color:#0B1626;border-color:var(--white);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.avatar{
  width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover;background:var(--card-hi);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;color:var(--dim);
  border:1px solid var(--line);overflow:hidden;
}
img.avatar{display:block}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs-h) + var(--safe-b) + 18px);
  z-index:70;background:var(--card-hi);border:1px solid var(--line-2);border-radius:12px;
  padding:11px 17px;font-size:14px;max-width:min(92vw,420px);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.28);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============================ capture ============================ */
.hero{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.hero .mark{flex:none}
.hero h1{font-size:22px;line-height:1.15}
.hero p{margin:2px 0 0;font-size:13px;color:var(--faint)}
.capture-box{position:relative}
.capture-box textarea{min-height:150px;padding-bottom:52px;font-size:16.5px;line-height:1.55}
.capture-tools{position:absolute;inset-inline:9px;bottom:9px;display:flex;gap:8px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(10,20,35,.85);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:rgba(255,255,255,.16)}
.icon-btn.rec{background:var(--white);color:#0B1626;border-color:var(--white);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,255,255,.12)}}
.thumbs{display:flex;gap:9px;overflow-x:auto;padding:11px 0 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:none}
.thumb img{width:78px;height:78px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.thumb button{
  position:absolute;top:-6px;inset-inline-end:-6px;width:24px;height:24px;border-radius:50%;
  background:#0B1626;border:1px solid var(--line-2);color:var(--fg);font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.bday{display:flex;align-items:center;gap:11px;padding:9px 0}
.bday + .bday{border-top:1px solid var(--line)}
.bday .when{margin-inline-start:auto;font-size:12.5px;color:var(--dim);text-align:end;white-space:nowrap}

/* ============================ people ============================ */
.plist{margin-top:4px}
.prow{
  display:flex;align-items:center;gap:13px;padding:11px 2px;width:100%;text-align:start;
  border-bottom:1px solid var(--line);
}
.prow:active{background:rgba(255,255,255,.05)}
.prow .nm{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sub{font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.prow .col{min-width:0;flex:1}
.grp{margin:22px 0 4px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}

/* ============================ person ============================ */
.phero{display:flex;gap:15px;align-items:center;margin-bottom:6px}
.phero .avatar{width:76px;height:76px;font-size:28px}
.phero h1{font-size:24px;line-height:1.2;word-break:break-word}
.phero .meta{font-size:13px;color:var(--faint);margin-top:4px}
.dl{margin:0}
.dl .k{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.dl .v{font-size:15.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.dl .item + .item{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.dl ul{margin:0;padding-inline-start:19px}
.dl li{margin:2px 0}
.fact{display:flex;gap:11px;padding:11px 0;align-items:flex-start}
.fact + .fact{border-top:1px solid var(--line)}
.fact .tx{flex:1;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.fact .dt{font-size:11px;color:var(--faint);margin-top:4px;letter-spacing:.03em}
.fact .x{color:var(--faint);font-size:19px;line-height:1;padding:2px 5px;flex:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.gal .cell{position:relative}
.gal .cell.is-av::after{content:'★';position:absolute;top:5px;inset-inline-start:7px;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* ============================ review ============================ */
.rv{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card)}
.rv + .rv{margin-top:12px}
.rv.off{opacity:.42}
.rv-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.rv-head input{flex:1;font-family:var(--serif);font-size:17.5px}
.badge{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid var(--line-2);color:var(--dim);white-space:nowrap}
.badge.new{background:var(--white);color:#0B1626;border-color:var(--white);font-weight:700}
.tick{display:flex;gap:10px;align-items:flex-start;padding:8px 0;width:100%;text-align:start}
.tick + .tick{border-top:1px solid var(--line)}
.box{
  width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2);flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#0B1626;
}
.box.on{background:var(--white);border-color:var(--white)}
.tick .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.tick .v{font-size:14.8px;line-height:1.45;word-break:break-word}
.tick .old{font-size:12px;color:var(--faint);text-decoration:line-through;margin-top:2px;display:block}
.tick .old.keep{text-decoration:none}
.rv-photo{flex:none;width:100px}
.rv-photo img{width:100px;height:100px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.rv-photo select{margin-top:6px;min-height:34px;padding:5px 8px;font-size:13px}

/* ============================ modal ============================ */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(4,8,15,.72)}
#modal.on{display:flex}
.sheet{
  width:100%;max-width:520px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:20px 18px calc(var(--safe-b) + 20px);
  max-height:86dvh;overflow:auto;animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet h2{font-size:19px;margin-bottom:13px}
#viewer{position:fixed;inset:0;z-index:90;background:rgba(4,8,15,.96);display:none;align-items:center;justify-content:center}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:100dvh;object-fit:contain}
</style>
</head>
<body>

<!-- ================================ lock ================================ -->
<div id="lock" class="chrome">
  <svg class="mark" width="76" height="76" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="36" r="30.25" fill="none" stroke="#fff" stroke-width="11.5"/>
    <path d="M4.5 78.49 L50 88.5 L95.5 78.49 L95.5 89.99 L50 100 L4.5 89.99 Z" fill="#fff"/>
  </svg>
  <div class="lock-name">Palantir</div>
  <div class="lock-sub" data-i18n="lock.sub"></div>
  <div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
  <div class="lock-msg" id="lockMsg"></div>
  <div class="pad" id="pad"></div>
</div>

<!-- ================================ app ================================= -->
<div id="app">
  <header id="topbar" class="chrome">
    <div id="tbLeft"></div>
    <div class="tb-title" id="tbTitle">Palantir</div>
    <div id="tbRight" style="display:flex;gap:8px"></div>
  </header>
  <main id="view"></main>
</div>

<nav id="tabs" class="chrome hide"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="viewer"><img id="viewerImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Palantir — a private memory for the people you know.
   One file, no build step, no server. Profiles and photos live in
   IndexedDB on this device. The only network call the app ever makes is
   the optional one you trigger yourself: sorting a brain-dump with the
   Claude API, using a key you paste in Settings.
   ===================================================================== */

/* ------------------------------ helpers ------------------------------ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const clean = a => (Array.isArray(a) ? a : []).map(v => String(v ?? '').trim()).filter(Boolean);
const uniq = a => Array.from(new Set(a.map(v => v.trim()).filter(Boolean)));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, ms = 2400){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), ms);
}

/* ------------------------------- i18n -------------------------------- */
const I18N = {
  en: {
    'lock.sub': 'Enter your passcode',
    'lock.wrong': 'Wrong passcode',
    'lock.clear': 'Clear',
    'tab.capture': 'Capture', 'tab.people': 'People', 'tab.settings': 'Settings',

    'greet.morning': 'Good morning', 'greet.afternoon': 'Good afternoon',
    'greet.evening': 'Good evening', 'greet.night': 'Still up',

    'cap.lede': 'Tell me what you heard today.',
    'cap.ph': 'Anna said her sister just had a baby, and she starts at Deloitte in October. Tomek got a dog — a beagle called Fistaszek…',
    'cap.mic': 'Dictate', 'cap.micStop': 'Stop dictating',
    'cap.photo': 'Add a photo',
    'cap.sort': 'Sort into profiles',
    'cap.sorting': 'Reading…',
    'cap.clear': 'Clear draft',
    'cap.empty': 'Write or dictate something first.',
    'cap.noKey': 'Add a Claude API key in Settings to sort automatically — or add people by hand.',
    'cap.noMic': 'Dictation is not available in this browser.',
    'cap.reviewWaiting': 'You have suggestions waiting — review them',
    'cap.upcoming': 'Birthdays coming up',
    'cap.recent': 'Recently updated',
    'cap.addManual': 'Add someone by hand',

    'ppl.title': 'People', 'ppl.search': 'Search names, places, anything',
    'ppl.all': 'Everyone', 'ppl.empty': 'No one here yet.\nStart by writing what you know on the Capture tab.',
    'ppl.none': 'Nothing matched that search.',
    'ppl.count': '{n} people', 'ppl.count1': '1 person',
    'ppl.new': 'New person',

    'per.new': 'New person', 'per.edit': 'Edit', 'per.save': 'Save',
    'per.delete': 'Delete person', 'per.deleteQ': 'Delete {name} and everything stored about them?',
    'per.photos': 'Photos', 'per.addPhoto': 'Add photos',
    'per.setAvatar': 'Use as portrait', 'per.delPhoto': 'Delete photo',
    'per.viewPhoto': 'View full size',
    'per.facts': 'What I know', 'per.addFact': 'Add something you learned…',
    'per.noFacts': 'Nothing written down yet.',

function t(key, vars){
  const table = I18N[state.lang] || I18N.en;
  let s = table[key] ?? I18N.en[key] ?? key;
  if (vars) for (const k in vars) s = s.replaceAll('{' + k + '}', vars[k]);
  return s;
}

function blankPerson(){
  const p = { id: uid(), name: '', aka: [], category: 'other', facts: [], avatarId: '',
              createdAt: nowISO(), updatedAt: nowISO() };
  for (const f of FIELDS) p[f.k] = f.kind === 'list' ? [] : '';
  return p;
}
function catLabel(id){
  if (DEFAULT_CATS.includes(id)) return t('cat.' + id);
  return id;
}
function allCats(){
  const extra = (state.settings.categories || []).filter(c => !DEFAULT_CATS.includes(c));
  return [...DEFAULT_CATS.filter(c => c !== 'other'), ...extra, 'other'];
}

/* ----------------------------- IndexedDB ----------------------------- */
const DB_NAME = 'palantir', DB_VER = 1;
let _db = null;
function db(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('people')) d.createObjectStore('people', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('photos')){
        const s = d.createObjectStore('photos', { keyPath: 'id' });
        s.createIndex('personId', 'personId');
      }
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
const wrap = req => new Promise((res, rej) => {
  req.onsuccess = () => res(req.result);
  req.onerror = () => rej(req.error);
});
async function store(name, mode = 'readonly'){
  return (await db()).transaction(name, mode).objectStore(name);
}
const DB = {
  async all(name){ return wrap((await store(name)).getAll()); },
  async get(name, k){ return wrap((await store(name)).get(k)); },
  async put(name, v, k){ return wrap((await store(name, 'readwrite')).put(v, k)); },
  async del(name, k){ return wrap((await store(name, 'readwrite')).delete(k)); },
  async clear(name){ return wrap((await store(name, 'readwrite')).clear()); },
  async byPerson(personId){
    const s = await store('photos');
    return wrap(s.index('personId').getAll(personId));
  },
};

/* --------------------------- object URLs ----------------------------- */
const urlCache = new Map();
function photoURL(photo){
  if (!photo) return '';
  if (urlCache.has(photo.id)) return urlCache.get(photo.id);
  const u = URL.createObjectURL(photo.blob);
  urlCache.set(photo.id, u);
  return u;
}
function forgetURL(id){
  const u = urlCache.get(id);
  if (u){ URL.revokeObjectURL(u); urlCache.delete(id); }
  photoRecCache.delete(id);
}

/* ---------------------------- image utils ---------------------------- */
async function loadBitmap(blob){
  if (window.createImageBitmap){
    try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); }
    catch { try { return await createImageBitmap(blob); } catch { /* fall through */ } }
  }
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(blob);
    img.onload = () => { URL.revokeObjectURL(u); res(img); };
    img.onerror = e => { URL.revokeObjectURL(u); rej(e); };
    img.src = u;
  });
}
async function resize(blob, maxEdge, quality){
  const bmp = await loadBitmap(blob);
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  const scale = Math.min(1, maxEdge / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  const out = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
  return { blob: out || blob, w, h };
}
function blobToDataURL(blob){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}
async function blobToBase64(blob){
  const d = await blobToDataURL(blob);
  return d.slice(d.indexOf(',') + 1);
}
function dataURLToBlob(u){
  const [head, b64] = u.split(',');
  const mime = /:(.*?);/.exec(head)[1];
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function ingestPhoto(file, personId){
  const { blob, w, h } = await resize(file, 1600, 0.85);
  const rec = { id: uid(), personId: personId || '', blob, w, h, createdAt: nowISO() };
  await DB.put('photos', rec);
  return rec;
}

/* ------------------------------- dates ------------------------------- */
/* Birthdays are stored as free text so nothing is ever lost, but we try to
   read a day and month out of them so the app can nudge you in advance. */
function parseBirthday(raw){
  const s = String(raw || '').trim();
  if (!s) return null;
  let m;
  if ((m = /^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(s)))
    return { y: +m[1], m: +m[2], d: +m[3] };
  if ((m = /^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/.exec(s)))
    return { y: +m[3], m: +m[2], d: +m[1] };
  if ((m = /^(\d{1,2})[-./](\d{1,2})$/.exec(s)))
    return { y: null, m: +m[2], d: +m[1] };
  if ((m = /^--(\d{2})-(\d{2})$/.exec(s)))
    return { y: null, m: +m[1], d: +m[2] };
  return null;
}
/* days until the next occurrence, plus the age reached on it */
function nextBirthday(b){
  if (!b || !b.m || !b.d) return null;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  let year = now.getFullYear();
  let next = new Date(year, b.m - 1, b.d);
  if (next < now){ year++; next = new Date(year, b.m - 1, b.d); }
  return { days: Math.round((next - now) / 86400000), age: b.y ? year - b.y : null };
}
function fmtBirthday(raw){
  const b = parseBirthday(raw);
  if (!b) return raw || '';
  const loc = state.lang === 'he' ? 'he-IL' : state.lang === 'pl' ? 'pl-PL' : 'en-GB';
  const d = new Date(b.y || 2000, b.m - 1, b.d);
  const opts = b.y ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'long' };
  try { return d.toLocaleDateString(loc, opts); } catch { return raw; }
}
function fmtDate(iso){
  if (!iso) return '';
  const loc = state.lang === 'he' ? 'he-IL' : state.lang === 'pl' ? 'pl-PL' : 'en-GB';
  try { return new Date(iso).toLocaleDateString(loc, { day: 'numeric', month: 'short', year: 'numeric' }); }
  catch { return iso.slice(0, 10); }
}
function fmtBytes(n){
  if (!n) return '0 KB';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0; while (n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  return (n < 10 && i > 0 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
}

/* ------------------------------- crypto ------------------------------ */
async function sha(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

const API_URL = 'https://api.anthropic.com/v1/messages';

function extractionSchema(cats){
  const str = { type: 'string' };
  const arr = { type: 'array', items: { type: 'string' } };
  const fieldProps = {};
  for (const f of FIELDS) fieldProps[f.api] = f.kind === 'list' ? arr : str;
  return {
    type: 'object',
    properties: {
      entries: {
        type: 'array',
        items: {
          type: 'object',
          properties: {
            match_id: str,
            name: str,
            category: { type: 'string', enum: cats },
            fields: { type: 'object', properties: fieldProps, required: Object.keys(fieldProps), additionalProperties: false },
            facts: arr,
            photo_indexes: { type: 'array', items: { type: 'integer' } },
          },
          required: ['match_id', 'name', 'category', 'fields', 'facts', 'photo_indexes'],
          additionalProperties: false,
        },
      },
      leftovers: arr,
    },
    required: ['entries', 'leftovers'],
    additionalProperties: false,
  };
}

function systemPrompt(cats){
  const roster = state.people.map(p => ({
    id: p.id, name: p.name, aka: p.aka, category: p.category,
    lives: p.residence || undefined, work: (p.currentWork || [])[0] || undefined,
  }));
  const langName = { en: 'English', pl: 'Polish', he: 'Hebrew' }[state.lang] || 'English';
  return [
    'You sort a person\'s spoken or typed notes into profiles of the people they know.',
    'Today is ' + new Date().toISOString().slice(0, 10) + '. The user writes in ' + langName + ' but may mix languages.',
    '',
    'Return one entry per person mentioned in the note.',
    '- match_id: the id of an existing person from the roster below when the note is clearly about them (same name, nickname, or unmistakable context). Otherwise "".',
    '- name: the person\'s name as the user would write it. For an existing person, repeat their stored name.',
    '- category: pick from ' + cats.join(', ') + '. Keep an existing person\'s category unless the note plainly says otherwise.',
    '- fields: only what the note actually states. Leave a string "" and a list [] when the note says nothing. Never guess, never carry information over from one person to another.',
    '  birthday: normalise to YYYY-MM-DD, or MM-DD when the year is unknown; keep any extra wording out of it.',
    '  current_work / former_work: "Role at Company" or just the company. Move a job to former_work when the note says they left it.',
    '  relationships: family members and partners, e.g. "sister Maja", "wife Ola".',
    '- facts: everything else worth remembering, one short sentence each, in the language the user used. Write them as standalone statements — the user will read them months from now. Do not repeat something already captured in fields.',
    '- photo_indexes: indexes of the attached photos that show or belong to this person, based on what the note says about them. Use [] when unsure.',
    '',
    'leftovers: any part of the note that is not about a specific person. Use [] when there is none.',
    'Say nothing outside the JSON.',
    '',
    'Roster of people already on file (JSON):',
    JSON.stringify(roster),
  ].join('\n');
}

async function callClaude(body){
  const key = (state.settings.apiKey || '').trim();
  if (!key) throw new Error('NO_KEY');
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify(body),
  });
  const text = await res.text();
  let json = null;
  try { json = JSON.parse(text); } catch { /* keep raw */ }
  if (!res.ok){
    const msg = json?.error?.message || text.slice(0, 300) || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return json;
}

function firstText(msg){
  for (const b of msg?.content || []) if (b.type === 'text' && b.text) return b.text;
  return '';
}
function parseJSONLoose(s){
  try { return JSON.parse(s); } catch { /* try harder */ }
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a){ try { return JSON.parse(s.slice(a, b + 1)); } catch { /* no */ } }
  return null;
}

async function sortWithAI(){
  const cats = allCats();
  const content = [];
  for (const ph of state.draft.photos){
    const small = await resize(ph.blob, 1400, 0.82);
    content.push({
      type: 'image',
      source: { type: 'base64', media_type: 'image/jpeg', data: await blobToBase64(small.blob) },
    });
  }
  const note = state.draft.text.trim();
  content.push({
    type: 'text',
    text: (state.draft.photos.length
      ? 'Attached photos, in order, are indexes 0..' + (state.draft.photos.length - 1) + '.\n\n'
      : '') + 'Note:\n' + (note || '(no text — work from the photos alone)'),
  });

  const model = state.settings.model || DEFAULT_MODEL;
  const output_config = { format: { type: 'json_schema', schema: extractionSchema(cats) } };
  if (takesEffort(model)) output_config.effort = 'medium';

  const msg = await callClaude({
    model, max_tokens: 8000,
    system: systemPrompt(cats),
    messages: [{ role: 'user', content }],
    output_config,
  });

  if (msg.stop_reason === 'refusal') throw new Error('The model declined to answer that note.');
  const data = parseJSONLoose(firstText(msg));
  if (!data || !Array.isArray(data.entries)) throw new Error('Unexpected answer from the model.');
  return data;
}

/* Build the reviewable proposal from the model's answer. */
function buildReview(data){
  const entries = [];
  for (const e of data.entries || []){
    const name = String(e.name || '').trim();
    if (!name) continue;
    const existing = e.match_id ? state.people.find(p => p.id === e.match_id) : null;
    const changes = [];
    for (const f of FIELDS){
      const raw = (e.fields || {})[f.api];
      if (f.kind === 'list'){
        const vals = uniq(clean(raw));
        const have = existing ? (existing[f.k] || []) : [];
        const add = vals.filter(v => !have.some(h => h.toLowerCase() === v.toLowerCase()));
        if (add.length) changes.push({ key: f.k, kind: 'list', value: add, old: have.join(', '), on: true });
      } else {
        const v = String(raw ?? '').trim();
        if (!v) continue;
        const old = existing ? String(existing[f.k] || '') : '';
        if (old.trim().toLowerCase() === v.toLowerCase()) continue;
        changes.push({ key: f.k, kind: 'text', value: v, old, on: true });
      }
    }
    const facts = clean(e.facts).map(text => ({ text, on: true }));
    const photos = (Array.isArray(e.photo_indexes) ? e.photo_indexes : [])
      .map(i => state.draft.photos[i]).filter(Boolean).map(p => p.id);
    if (!changes.length && !facts.length && !photos.length && existing) continue;
    entries.push({
      id: uid(),
      on: true,
      name,
      matchId: existing ? existing.id : '',
      category: (e.category && allCats().includes(e.category)) ? e.category
              : (existing ? existing.category : 'other'),
      changes, facts, photos,
    });
  }
  const claimed = new Set(entries.flatMap(e => e.photos));
  const loose = state.draft.photos.filter(p => !claimed.has(p.id)).map(p => p.id);
  if (loose.length && entries.length) entries[0].photos.push(...loose);
  return { entries, leftovers: clean(data.leftovers), at: nowISO() };
}

async function applyReview(){
  const rev = state.review;
  if (!rev) return 0;
  let n = 0;
  for (const e of rev.entries){
    if (!e.on) continue;
    let p = e.matchId ? state.people.find(x => x.id === e.matchId) : null;
    if (!p){ p = blankPerson(); p.name = e.name.trim(); }
    else if (e.name.trim() && e.name.trim() !== p.name){
      p.aka = uniq([...(p.aka || []), e.name.trim()].filter(v => v !== p.name));
    }
    p.category = e.category || p.category;
    for (const c of e.changes){
      if (!c.on) continue;
      if (c.kind === 'list') p[c.key] = uniq([...(p[c.key] || []), ...c.value]);
      else p[c.key] = c.value;
    }
    for (const f of e.facts){
      if (!f.on) continue;
      p.facts = p.facts || [];
      p.facts.push({ id: uid(), text: f.text, at: nowISO() });
    }
    await savePerson(p);
    for (const photoId of e.photos){
      const rec = await DB.get('photos', photoId);
      if (!rec) continue;
      rec.personId = p.id;
      await DB.put('photos', rec);
      if (!p.avatarId){ p.avatarId = rec.id; await savePerson(p); }
      invalidatePhotos(p.id);
      state.draft.photos = state.draft.photos.filter(x => x.id !== photoId);
    }
    n++;
  }
  for (const ph of state.draft.photos){ forgetURL(ph.id); await DB.del('photos', ph.id); }
  state.draft = { text: '', photos: [] };
  await DB.put('meta', { text: '' }, 'draft');
  state.review = null;
  await DB.del('meta', 'review');
  return n;
}

let entered = '';
function paintDots(){
  $$('#dots .dot').forEach((d, i) => d.classList.toggle('on', i < entered.length));
}
function buildPad(){
  const pad = $('#pad');
  const keys = ['1','2','3','4','5','6','7','8','9','', '0', '⌫'];
  pad.innerHTML = keys.map(k =>
    k === '' ? '<div class="key blank"></div>'
    : k === '⌫' ? '<button class="key fn" data-key="del" aria-label="delete">⌫</button>'
    : `<button class="key" data-key="${k}">${k}</button>`).join('');
}
async function pressKey(k){
  const lock = $('#lock');
  lock.classList.remove('err');
  $('#lockMsg').textContent = '';
  if (k === 'del'){ entered = entered.slice(0, -1); paintDots(); return; }
  if (entered.length >= 4) return;
  entered += k;
  paintDots();
  if (entered.length === 4){
    const ok = (await sha(entered)) === state.settings.pass;
    if (ok){
      entered = '';
      await unlock();
    } else {
      lock.classList.add('err');
      $('#lockMsg').textContent = t('lock.wrong');
      if (navigator.vibrate) navigator.vibrate(60);
      await sleep(420);
      entered = ''; paintDots();
    }
  }
}
async function unlock(){
  paintDots();
  $('#lock').classList.add('hide');
  $('#app').classList.add('on');
  $('#tabs').classList.remove('hide');
  lastHidden = 0;
  render();
}
function lockNow(){
  entered = ''; paintDots();
  $('#lockMsg').textContent = '';
  $('#lock').classList.remove('hide', 'err');
  $('#app').classList.remove('on');
  $('#tabs').classList.add('hide');
}
let lastHidden = 0;
const RELOCK_AFTER = 3 * 60 * 1000;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ lastHidden = Date.now(); return; }
  const away = lastHidden ? Date.now() - lastHidden : 0;
  if (away > RELOCK_AFTER && $('#app').classList.contains('on')) lockNow();
});

async function avatarHTML(p, size = 46){
  const rec = await avatarFor(p);
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.38)}px`;
  if (rec) return `<img class="avatar" style="${st}" src="${photoURL(rec)}" alt="">`;
  const initials = (p.name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
  return `<span class="avatar" style="${st}">${esc(initials || '?')}</span>`;
}

async function runSort(){
  if (!state.draft.text.trim() && !state.draft.photos.length){ toast(t('cap.empty')); return; }
  const btn = $('#sortBtn');
  btn.disabled = true;
  $('#sortLabel').innerHTML = `<span class="spin"></span> ${esc(t('cap.sorting'))}`;
  try {
    const data = await sortWithAI();
    const review = buildReview(data);
    if (!review.entries.length && !review.leftovers.length){ toast(t('rev.none')); return; }
    state.review = review;
    await DB.put('meta', review, 'review');
    go('#/review');
  } catch (err){
    console.error(err);
    toast(err.message === 'NO_KEY' ? t('cap.noKey') : (err.message || t('c.error')), 5200);
  } finally {
    btn.disabled = false;
    $('#sortLabel').textContent = t('cap.sort');
  }
}

/* dictation */
let recog = null;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  if (state.listening){ recog?.stop(); return; }
  recog = new SR();
  recog.lang = SPEECH_LOCALE[state.lang] || 'en-US';
  recog.continuous = true;
  recog.interimResults = true;
  let base = state.draft.text;
  recog.onresult = e => {
    let finalTx = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal) finalTx += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (finalTx){
      base = (base ? base.replace(/\s+$/, '') + ' ' : '') + finalTx.trim();
      state.draft.text = base;
      saveDraftSoon();
    }
    const ta = $('#draft');
    if (ta){ ta.value = base + (interim ? ' ' + interim : ''); ta.scrollTop = ta.scrollHeight; }
  };
  recog.onerror = e => { toast(String(e.error || t('c.error'))); };
  recog.onend = () => { state.listening = false; $('#micBtn')?.classList.remove('rec'); };
  try { recog.start(); state.listening = true; $('#micBtn')?.classList.add('rec'); }
  catch { toast(t('c.error')); }
}

async function paintPeopleList(){
  const box = $('#plist');
  if (!box) return;
  const q = state.query.trim().toLowerCase();
  const inFilter = p => state.filter === 'all' || p.category === state.filter;
  const hay = p => [p.name, ...(p.aka || []), catLabel(p.category),
      ...FIELDS.map(f => Array.isArray(p[f.k]) ? p[f.k].join(' ') : p[f.k]),
      ...(p.facts || []).map(f => f.text)].join(' ').toLowerCase();
  const list = state.people.filter(p => inFilter(p) && (!q || hay(p).includes(q)));
  const flip = document.documentElement.dir === 'rtl' ? 'transform:scaleX(-1)' : '';

  const rows = await Promise.all(list.map(async p => {
    const bits = [catLabel(p.category), (p.currentWork || [])[0], p.residence].filter(Boolean);
    return `<button class="prow" data-go="#/person/${p.id}">
      ${await avatarHTML(p)}
      <span class="col"><span class="nm">${esc(p.name)}</span><span class="sub">${esc(bits.join(' · '))}</span></span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.8" stroke-linecap="round" style="flex:none;${flip}"><path d="M9 5l7 7-7 7"/></svg>
    </button>`;
  }));

  box.innerHTML = list.length ? rows.join('')
    : `<div class="empty">${esc(state.people.length ? t('ppl.none') : t('ppl.empty')).replace(/\n/g, '<br>')}</div>`;
  $('#pcount').textContent = list.length
    ? (list.length === 1 ? t('ppl.count1') : t('ppl.count', { n: list.length })) : '';
}

async function addFact(id){
  const inp = $('#factIn');
  const text = (inp?.value || '').trim();
  if (!text) return;
  const p = state.people.find(x => x.id === id);
  p.facts = p.facts || [];
  p.facts.push({ id: uid(), text, at: nowISO() });
  await savePerson(p);
  inp.value = '';
  render();
}

function collectEdit(){
  const p = state.editing;
  for (const el of $$('#view [data-k]')){
    const k = el.dataset.k;
    if (el.dataset.list) p[k] = uniq(el.value.split(','));
    else if (el.dataset.lines) p[k] = uniq(el.value.split('\n'));
    else p[k] = el.value.trim();
  }
  return p;
}

      <div class="field"><button class="btn ghost" data-act="setPass">${esc(t('set.changePass'))}</button></div>
    </div>

    <div class="sec">${esc(t('set.data'))}</div>
    <div class="card">
      <div class="hint" style="margin:0 0 12px">${esc(t('set.storage', { people: state.people.length, photos: photos.length, size: fmtBytes(bytes) }))}</div>
      <div class="field"><button class="btn ghost" data-act="exportData">${esc(t('set.export'))}</button></div>
      <div class="field"><button class="btn ghost" data-act="importData">${esc(t('set.import'))}</button></div>
      <div class="field"><button class="btn ghost danger" data-act="wipe">${esc(t('set.wipe'))}</button></div>
    </div>

    <div class="sec">${esc(t('set.about'))}</div>
    <div class="card"><div class="hint" style="margin:0">${esc(t('set.aboutText'))}</div></div>
    <div class="hint" style="text-align:center;margin-top:18px">Palantir · v1.0</div>
  `;

  $('#apiKey').addEventListener('change', async e => {
    state.settings.apiKey = e.target.value.trim();
    await saveSettings();
    toast(t('per.saved'));
  });
  $('#model').addEventListener('change', async e => {
    state.settings.model = e.target.value;
    await saveSettings();
  });
}

async function testKey(){
  const label = $('#testLabel');
  const key = ($('#apiKey')?.value || '').trim();
  state.settings.apiKey = key;
  await saveSettings();
  label.innerHTML = '<span class="spin"></span>';
  try {
    await callClaude({
      model: state.settings.model || DEFAULT_MODEL,
      max_tokens: 64,
      messages: [{ role: 'user', content: 'Reply with the single word: ok' }],
    });
    toast(t('set.keyOk'));
  } catch (err){
    toast(t('set.keyBad', { e: err.message === 'NO_KEY' ? '—' : err.message }), 6000);
  } finally {
    label.textContent = t('set.test');
  }
}

/* ------------------------------ backup ------------------------------- */
async function exportData(){
  const photos = await DB.all('photos');
  const out = {
    app: 'palantir', version: 1, exportedAt: nowISO(),
    settings: { lang: state.settings.lang, model: state.settings.model, categories: state.settings.categories },
    people: state.people,
    photos: [],
  };
  for (const ph of photos){
    if (ph.personId === '__draft__' || !ph.personId) continue;
    out.photos.push({ id: ph.id, personId: ph.personId, w: ph.w, h: ph.h, createdAt: ph.createdAt,
                      data: await blobToDataURL(ph.blob) });
  }
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'palantir-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function pickFile(accept, multiple = false){
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept; i.multiple = multiple;
    i.style.position = 'fixed'; i.style.left = '-9999px';
    document.body.appendChild(i);
    i.addEventListener('change', () => { res(Array.from(i.files || [])); i.remove(); }, { once: true });
    i.click();
  });
}

async function importData(){
  const [file] = await pickFile('application/json,.json');
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast(t('set.badFile')); return; }
  if (!data || data.app !== 'palantir' || !Array.isArray(data.people)){ toast(t('set.badFile')); return; }
  if (!await confirmSheet(t('set.import'), t('set.importQ'))) return;

  for (const u of urlCache.values()) URL.revokeObjectURL(u);
  urlCache.clear();
  photoRecCache.clear();
  await DB.clear('people'); await DB.clear('photos');
  for (const p of data.people) await DB.put('people', p);
  for (const ph of data.photos || []){
    try {
      await DB.put('photos', { id: ph.id, personId: ph.personId, w: ph.w, h: ph.h,
                               createdAt: ph.createdAt, blob: dataURLToBlob(ph.data) });
    } catch { /* skip a broken photo rather than lose the whole restore */ }
  }
  if (data.settings){
    state.settings.categories = data.settings.categories || [];
    state.settings.model = data.settings.model || state.settings.model;
    await saveSettings();
  }
  state.photosOf.clear();
  await loadPeople();
  toast(t('set.imported', { n: data.people.length }));
  render();
}

async function wipeAll(){
  if (!await confirmSheet(t('set.wipe'), t('set.wipeQ'))) return;
  for (const u of urlCache.values()) URL.revokeObjectURL(u);
  urlCache.clear();
  photoRecCache.clear();
  await DB.clear('people'); await DB.clear('photos'); await DB.clear('meta');
  state.people = []; state.photosOf.clear(); state.review = null;
  state.draft = { text: '', photos: [] };
  state.settings.pass = await sha('3671');
  state.settings.apiKey = '';
  state.settings.categories = [];
  await saveSettings();
  toast(t('c.done'));
  if (location.hash === '#/capture') render(); else go('#/capture');
}

/* ------------------------------- modals ------------------------------ */
function closeSheet(){ $('#modal').classList.remove('on'); $('#sheet').innerHTML = ''; }
function confirmSheet(title, body, danger = true){
  return new Promise(res => {
    $('#sheet').innerHTML = `
      <h2>${esc(title)}</h2>
      <p style="color:var(--dim);font-size:14.5px;line-height:1.55;margin:0 0 18px">${esc(body)}</p>
      <div style="display:grid;gap:10px">
        <button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(danger ? t('c.delete') : t('c.ok'))}</button>
        <button class="btn ghost" data-no>${esc(t('c.cancel'))}</button>
      </div>`;
    $('#modal').classList.add('on');
    const done = v => { closeSheet(); res(v); };
    $('#sheet [data-yes]').onclick = () => done(true);
    $('#sheet [data-no]').onclick = () => done(false);
    $('#modal').onclick = e => { if (e.target.id === 'modal') done(false); };
  });
}
function photoSheet(personId, photoId){
  const p = state.people.find(x => x.id === personId);
  $('#sheet').innerHTML = `
    <h2>${esc(t('per.photos'))}</h2>
    <div style="display:grid;gap:10px">
      <button class="btn ghost" data-act="viewPhoto" data-pid="${photoId}">${esc(t('per.viewPhoto'))}</button>
      <button class="btn ghost" data-act="makeAvatar" data-id="${personId}" data-pid="${photoId}" ${p.avatarId === photoId ? 'disabled' : ''}>${esc(t('per.setAvatar'))}</button>
      <button class="btn ghost danger" data-act="delPhoto" data-id="${personId}" data-pid="${photoId}">${esc(t('per.delPhoto'))}</button>
      <button class="btn ghost" data-act="closeSheet">${esc(t('c.cancel'))}</button>
    </div>`;
  $('#modal').classList.add('on');
  $('#modal').onclick = e => { if (e.target.id === 'modal') closeSheet(); };
}

/* ===================================================================== */
/*                            event delegation                           */
/* ===================================================================== */
document.addEventListener('click', async e => {
  const keyBtn = e.target.closest('[data-key]');
  if (keyBtn){ pressKey(keyBtn.dataset.key); return; }

  const goEl = e.target.closest('[data-go]');
  if (goEl){ go(goEl.dataset.go); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  const id = el.dataset.id, pid = el.dataset.pid;

  switch (a){
    /* --- capture --- */
    case 'newPerson': go('#/edit/new'); break;
    case 'pickPhoto': {
      const files = await pickFile('image/*', true);
      for (const f of files){
        const rec = await ingestPhoto(f, '__draft__');
        state.draft.photos.push(rec);
      }
      if (files.length) render();
      break;
    }
    case 'dropDraftPhoto': {
      forgetURL(id);
      await DB.del('photos', id);
      state.draft.photos = state.draft.photos.filter(p => p.id !== id);
      render();
      break;
    }
    case 'clearDraft': {
      if (!await confirmSheet(t('cap.clear'), t('c.confirm'))) break;
      await clearDraft();
      render();
      break;
    }

    /* --- review --- */
    case 'rvToggle': {
      const e0 = state.review.entries[+el.dataset.e];
      e0.on = !e0.on;
      await DB.put('meta', state.review, 'review');
      render();
      break;
    }
    case 'rvChange': {
      const c = state.review.entries[+el.dataset.e].changes[+el.dataset.c];
      c.on = !c.on;
      await DB.put('meta', state.review, 'review');
      render();
      break;
    }
    case 'rvFact': {
      const f = state.review.entries[+el.dataset.e].facts[+el.dataset.f];
      f.on = !f.on;
      await DB.put('meta', state.review, 'review');
      render();
      break;
    }
    case 'applyReview': {
      const n = await applyReview();
      toast(t('rev.applied', { n }));
      go('#/people');
      break;
    }
    case 'discardReview': {
      if (!await confirmSheet(t('rev.discard'), t('rev.discardQ'))) break;
      state.review = null;
      await DB.del('meta', 'review');
      go('#/capture');
      break;
    }

    /* --- people --- */
    case 'filter': {
      state.filter = el.dataset.cat;
      $$('#chips .chip').forEach(c => c.classList.toggle('on', c.dataset.cat === state.filter));
      paintPeopleList();
      break;
    }

    /* --- person --- */
    case 'addFact': addFact(id); break;
    case 'delFact': {
      const p = state.people.find(x => x.id === id);
      p.facts = (p.facts || []).filter(f => f.id !== el.dataset.fid);
      await savePerson(p);
      render();
      break;
    }
    case 'pickPersonPhoto': {
      const files = await pickFile('image/*', true);
      const p = state.people.find(x => x.id === id);
      for (const f of files){
        const rec = await ingestPhoto(f, id);
        if (!p.avatarId){ p.avatarId = rec.id; await savePerson(p); }
      }
      if (files.length){ invalidatePhotos(id); render(); }
      break;
    }
    case 'photoMenu': photoSheet(id, pid); break;
    case 'viewPhoto': {
      const rec = await DB.get('photos', pid);
      if (rec){ $('#viewerImg').src = photoURL(rec); $('#viewer').classList.add('on'); }
      closeSheet();
      break;
    }
    case 'makeAvatar': {
      const p = state.people.find(x => x.id === id);
      p.avatarId = pid;
      await savePerson(p);
      closeSheet(); render();
      break;
    }
    case 'delPhoto': {
      closeSheet();
      if (!await confirmSheet(t('per.delPhoto'), t('c.confirm'))) break;
      const p = state.people.find(x => x.id === id);
      forgetURL(pid);
      await DB.del('photos', pid);
      if (p.avatarId === pid){
        const rest = (await DB.byPerson(id)).filter(x => x.id !== pid);
        p.avatarId = rest[0]?.id || '';
        await savePerson(p);
      }
      invalidatePhotos(id);
      render();
      break;
    }
    case 'delPerson': {
      const p = state.people.find(x => x.id === id);
      if (!await confirmSheet(t('per.delete'), t('per.deleteQ', { name: p.name }))) break;
      for (const ph of await DB.byPerson(id)){ forgetURL(ph.id); await DB.del('photos', ph.id); }
      await DB.del('people', id);
      state.people = state.people.filter(x => x.id !== id);
      invalidatePhotos(id);
      go('#/people');
      break;
    }

    /* --- edit --- */
    case 'cancelEdit': {
      const back = state.editing && state.people.some(x => x.id === state.editing.id)
        ? '#/person/' + state.editing.id : '#/people';
      state.editing = null;
      go(back);
      break;
    }
    case 'saveEdit': {
      const p = collectEdit();
      if (!p.name.trim()){ toast(t('per.nameReq')); break; }
      const isNew = el.dataset.new === '1';
      await savePerson(p);
      state.editing = null;
      toast(isNew ? t('per.added', { name: p.name }) : t('per.saved'));
      location.hash = '#/person/' + p.id;
      break;
    }

    /* --- settings --- */
    case 'setLang': {
      state.settings.lang = el.dataset.lang;
      state.lang = state.settings.lang;
      await saveSettings();
      applyLang();
      sortPeople();
      render();
      break;
    }
    case 'testKey': testKey(); break;
    case 'addCat': {
      const inp = $('#newCat');
      const v = (inp.value || '').trim();
      if (!v) break;
      const key = v.toLowerCase();
      if (allCats().some(c => c.toLowerCase() === key || catLabel(c).toLowerCase() === key)){ inp.value = ''; break; }
      state.settings.categories = uniq([...(state.settings.categories || []), v]);
      await saveSettings();
      inp.value = '';
      render();
      break;
    }
    case 'delCat': {
      const c = el.dataset.cat;
      const used = state.people.filter(p => p.category === c).length;
      if (used){ toast(t('set.catUsed', { n: used })); break; }
      state.settings.categories = (state.settings.categories || []).filter(x => x !== c);
      await saveSettings();
      render();
      break;
    }
    case 'setPass': {
      const a1 = ($('#p1').value || '').trim(), a2 = ($('#p2').value || '').trim();
      if (!/^\d{4}$/.test(a1)){ toast(t('set.passShort')); break; }
      if (a1 !== a2){ toast(t('set.passMismatch')); break; }
      state.settings.pass = await sha(a1);
      await saveSettings();
      $('#p1').value = ''; $('#p2').value = '';
      toast(t('set.passSaved'));
      break;
    }
    case 'exportData': exportData(); break;
    case 'importData': importData(); break;
    case 'wipe': wipeAll(); break;
    case 'closeSheet': closeSheet(); break;
  }
});

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'rvCat'){
    state.review.entries[+el.dataset.e].category = el.value;
    await DB.put('meta', state.review, 'review');
  }
  if (el.dataset.act === 'rvPhotoMove'){
    const pid = el.dataset.pid, to = el.value;
    for (const entry of state.review.entries) entry.photos = entry.photos.filter(x => x !== pid);
    if (to !== '-') state.review.entries[+to].photos.push(pid);
    await DB.put('meta', state.review, 'review');
    render();
  }
});
document.addEventListener('input', async e => {
  const el = e.target.closest('[data-act="rvName"]');
  if (!el) return;
  state.review.entries[+el.dataset.e].name = el.value;
  clearTimeout(el._t);
  el._t = setTimeout(() => DB.put('meta', state.review, 'review'), 400);
});

$('#viewer').addEventListener('click', () => {
  $('#viewer').classList.remove('on');
  $('#viewerImg').src = '';
});

window.addEventListener('hashchange', render);

/* ------------------------------- boot -------------------------------- */
function applyLang(){
  const rtl = state.lang === 'he';
  document.documentElement.lang = state.lang;
  document.documentElement.dir = rtl ? 'rtl' : 'ltr';
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
}

(async function boot(){
  buildPad();
  await loadSettings();
  applyLang();
  await loadPeople();
  await loadDraft();
  state.review = (await DB.get('meta', 'review')) || null;
  if (!location.hash) location.hash = '#/capture';
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
